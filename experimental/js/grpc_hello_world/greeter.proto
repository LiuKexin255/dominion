syntax = "proto3";

import "google/api/annotations.proto";

package experimental.js.grpc_hello_world;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply) {
    option (google.api.http) = {
      get: "/experimental/js/grpc-hello-world/say-hello"
    };
  }
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
