version: "3.0"
name: liukexin.{{run}}
type: test
desc: "grpc-js hello world self-heal test deployment (timed health stop)"
services:
  - artifact:
      path: //experimental/js/grpc_hello_world/service.yaml
      name: service
      # 选择 service.yaml 配置块池中的 service_config（contracts/yaml-schema.md §2）
      configs:
        - service_config
      env:
        GREETING_SUFFIX: ts-suffix
        # test-only 自愈注入（specs/052-deploy-health-probe/contracts/verification-testplan.md §2）：
        # 服务进程启动 60s 后停止其 health 端点，模拟进程挂死；liveness 判死 ≈30s +
        # 容器重启，与 health_test.go 的轮询窗口共同覆盖"判死+重启"全周期（> 60s 余量）
        HEALTH_STOP_AFTER_MS: "60000"
  - artifact:
      path: //experimental/js/grpc_hello_world/testplan/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - apitest.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /experimental/js/grpc-hello-world
