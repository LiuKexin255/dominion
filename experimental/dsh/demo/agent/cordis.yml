# dsh composition manifest — the single source of truth for the enabled plugin
# set (specs/047-dsh-chat-demo/contracts/dsh-agent-service.md §2). Direct rows
# per specs/070-dsh-upgrade/contracts/composition-manifest.md §3: baseline rows
# materialize through //third_party/dsh/core:runtime_pkg, service rows through
# the agent package.json / BUILD npm_deps. Row order carries no dependency
# semantics (cordis awaits by inject); layering is readability only.
# ── 基线行（经 //third_party/dsh/core:runtime_pkg 物化，不进 demo agent package.json）
- { id: timer,          name: '@deepseek-ai/cordis-plugin-timer' }
- { id: invariants,     name: '@deepseek-ai/dsh-invariants' }
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false   # 部署自有完整 system prompt
    includeRuntimeContext: false    # 无运行时上下文注入
    personaPrefix: 'You are a helpful demo chat assistant.'   # deployment persona——被 preset 的 dsh-persona 行遮蔽
# ── 服务声明行（demo agent package.json / BUILD npm_deps）
- { id: llm,            name: '@deepseek-ai/dsh-llm' }
- { id: session,        name: '@deepseek-ai/dsh-session' }
# 会话投影注册表（ctx.sessionProjections）：官方 agent-loop 的 static inject
# 与 preset registry 的 inject 都要求该服务在场（specs/070-dsh-upgrade/
# research.md D6；上游源码
# https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/core/agent-loop/src/index.ts）。
- { id: session-projection, name: '@deepseek-ai/dsh-session-projection' }
- { id: tools,          name: '@deepseek-ai/dsh-tools' }
- { id: agents,         name: '@deepseek-ai/dsh-agent' }
- { id: agent-loop,     name: '@deepseek-ai/dsh-agent-loop' }
# 0.1.7 拆分了官方 DeepSeek 面：`@deepseek-ai/dsh-llm-deepseek` 只提供
# Anthropic Messages transport 库，provider 由 `@deepseek-ai/dsh-llm-deepseek-api-key`
# 注册——wire 不再是 OpenAI Chat Completions，与本 demo 的 fake-llm（OpenAI
# Chat Completions，specs/047-dsh-chat-demo/contracts/fake-llm-wire.md）不兼容。
# demo 因此改走仓库内 OpenAI Chat Completions 适配器
# `@dominion/dsh-llm-opencode-go`（specs/063 产出），保持 fake-llm 与部署面
# 不变（specs/070-dsh-upgrade/research.md D7 未覆盖该 adapter 拆包，以安装包
# README/lib 实测为准）。
- id: llm-opencode-go
  name: '@dominion/dsh-llm-opencode-go'
  config:
    apiKeyEnv: FAKE_LLM_API_KEY   # dummy 值（deploy env 注入）；空值不携带 Authorization
    baseURL: !!js process.env.FAKE_LLM_BASE_URL   # 运行期 Dominion 服务发现注入（specs/047-dsh-chat-demo/spec.md FR-011）
    models:
      - id: fake-chat-v1
        contextWindow: 100000
# ── preset registry 与声明式模板（specs/070-dsh-upgrade/contracts/
# composition-manifest.md §3）。声明行即 preset 定义，宿主组合行 = 部署所有权
# = 系统信任：用户面无写删模板的路径（US3 语义 1）。demo 允许默认回落——无名
# 解析走 `default: demo-standard`（demo 无必选语义，异于 agent_v2 的
# fail-loud 空 default）；CreateConversation 仍必须显式给 store preset
# （session.ts compose 的 INVALID_ARGUMENT fail-loud，specs/060-agent-v2-team-optimize/
# contracts/preset-derivation.md §2）。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: demo-standard
- id: preset-demo-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: demo-standard
    name: demo-standard
    description: 仅 persona 行的标准模板
    plugins:
      - name: '@deepseek-ai/dsh-persona'
        config:
          prefix: 'You are the demo standard assistant.'
- id: preset-demo-tools
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: demo-tools
    name: demo-tools
    description: persona + demo_echo 工具行模板
    plugins:
      - name: '@deepseek-ai/dsh-persona'
        config:
          prefix: 'You are the demo tools assistant.'
      - name: '@dominion/dsh-demo-echo'
# preset 创作/编辑面（058 产出复用）：CRUD 只写内存 store（唯一事实源）；模板
# 声明快照与上方 preset-demo-* 行同构，authoring 据此把 store 记录派生为
# registry 声明，不再读模板文件系统（specs/070-dsh-upgrade/contracts/
# preset-model-mapping.md §2.3）。
- id: preset-authoring
  name: '@dominion/dsh-preset-authoring'
  config:
    templates:
      demo-standard:
        name: demo-standard
        description: 仅 persona 行的标准模板
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are the demo standard assistant.'
      demo-tools:
        name: demo-tools
        description: persona + demo_echo 工具行模板
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are the demo tools assistant.'
          - name: '@dominion/dsh-demo-echo'
