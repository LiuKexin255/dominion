name: dsh-demo-interface-test
description: |
  dsh-demo chat interface test — verifies the 3-service chat link:
  grpc-gateway (Go) → dsh agent (grpc-js/TS, B1-embedded dsh) → fake-llm (Go).

  Single-plan principle (style/large_test.md §测试计划数量): later stories
  append cases/targets to this plan's suite — never a new plan YAML.

  Test cases:
    1. TestChatReply — single-turn template hits and the no-match fallback
       return verbatim deterministic replies (047 US1-1/US1-3)
    2. TestChatReplyDeterminism — repeating the identical request returns
       the identical reply (047 US1-2)
    3. TestChatInvalidRequest — empty/missing message → 400; resource names
       outside conversations/* → routing-level 404 (047 Edge)
    4. TestMultiturnBranch — a conversation's second identical "hello"
       turn takes the greeting-again multi-turn template (047 US2-1)
    5. TestMultiturnIsolation — a fresh conversation's first "hello" stays
       on the first-turn greeting template (047 US2-2)
    6. TestMultiturnInterleaved — two interleaved conversations each follow
       their own branch sequence (047 US2-3)
    7. TestPresetConversationComposition — sessions bound to demo-tools vs
       demo-standard present different personas and the demo_echo guidance
       only when its preset row is present (058 US1 V1-1/V2-3)
    8. TestPresetDefaultSelection — a conversation created without a preset
       binds the roster default demo-standard (058 US1 V1-2)
    9. TestPresetSamePresetSharedBehaviour — two sessions on one preset
       report the same binding and behave identically (058 US1-AS3)
    10. TestPresetSessionStability — the binding is fixed at creation and
        survives later turns (058 US1-AS4)
    11. TestPresetIdempotentAndRebuild — same-preset recreate is idempotent,
        different-preset recreate rebuilds on the new composition (058 R4)
    12. TestPresetSendMessageWithoutCreate — sendMessage on a never-created
        conversation is FAILED_PRECONDITION (058 FR-002)
    13. TestPresetUnknownPresetRejected — an unknown preset id is rejected
        with INVALID_ARGUMENT and leaves no conversation behind
    14. TestPresetAuthoringLifecycle — the C1 closed loop: create → a new
        session runs the authored persona (hot creation) → persona update →
        the joined session keeps its generation while a new session lands on
        the new one → delete → the joined session stays servable while new
        binds are rejected (058 US2 V3-1/V3-2/V4-1/V4-3)
    15. TestPresetCreateRejections — duplicate id → 409 with the original
        intact; unknown template / malformed id / empty persona / empty
        update_mask / unknown-id update → 400/404; every rejection leaves no
        half-materialized state (058 US2-AS4)
    16. TestPresetTemplateDeleteRefused — deleting a deployment template is
        refused (FAILED_PRECONDITION) and the template keeps serving
        (058 US2, chat-api §2 DeletePreset)

suites:
  - name: default
    deploy: //experimental/dsh/demo/testplan/deploy.yaml
    endpoint:
      http:
        public: https://apitest.liukexin.com
    cases:
      - //experimental/dsh/demo/testplan:testplan_test
      - //experimental/dsh/demo/testplan:multiturn_test
      - //experimental/dsh/demo/testplan:preset_test
