name: team-graph-spike-interface-test
description: |
  Validates (A5) that ChatOpenAI pointed at the deployed game fake-llm can
  drive the LangGraph team graph end-to-end: the player calls make_move then
  stops, the planner calls update_strategy, and the conditional edge routes
  player → planner on the structured gameEnded signal.

suites:
  - name: default
    deploy: //experimental/ts/team_graph_spike/testplan/deploy.yaml
    endpoint:
      http:
        public: https://apitest.liukexin.com
    cases:
      - //experimental/ts/team_graph_spike/testplan:testplan_test
