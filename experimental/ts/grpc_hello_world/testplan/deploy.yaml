version: "3.0"
name: liukexin.{{run}}
type: test
desc: "grpc-js hello world test deployment"
services:
  - artifact:
      path: //experimental/ts/grpc_hello_world/service.yaml
      name: service
  - artifact:
      path: //experimental/ts/grpc_hello_world/testplan/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - apitest.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /experimental/ts/grpc-hello-world
