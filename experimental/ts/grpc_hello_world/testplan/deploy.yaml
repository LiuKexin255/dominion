version: "3.0"
name: liukexin.{{run}}
type: test
desc: "grpc-js hello world test deployment"
services:
  - artifact:
      path: //experimental/ts/grpc_hello_world/service/service.yaml
      name: service
  - artifact:
      path: //experimental/ts/grpc_hello_world/testplan/wrapper/service.yaml
      name: wrapper
    http:
      hostnames:
        - ts-grpc-hello.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /
