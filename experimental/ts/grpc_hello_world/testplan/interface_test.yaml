name: grpc-js-hello-world-interface-test
description: |
  grpc-js hello world HTTP acceptance test

  Service: grpc-js hello world TypeScript service
  Interface: HTTP wrapper exposed endpoint
  Config: service.yaml configs.service_config.greeting selected via
    deploy.yaml (message/times override SDK defaults)
  Test cases:
    1. TestSayHello — GET /say-hello?name=<name> returns config-driven greeting
       with GREETING_SUFFIX appended
    2. TestSayHelloConfigOverrides — response reflects config message, config
       times, and GREETING_SUFFIX env simultaneously (SC-006/FR-016)

suites:
  - name: default
    deploy: //experimental/ts/grpc_hello_world/testplan/deploy.yaml
    endpoint:
      http:
        public: https://apitest.liukexin.com
    cases:
      - //experimental/ts/grpc_hello_world/testplan:testplan_test
  # 自愈路径 suite（specs/052-deploy-health-probe/contracts/verification-testplan.md §2）：
  # deploy 注入 HEALTH_STOP_AFTER_MS，health_test 观测"成功 → liveness 判死失败窗口 → 恢复"。
  # timeout 900s 覆盖判死+重启全周期的轮询窗口（窗口设计见 health_test.go 常量）。
  - name: selfheal
    timeout: 900
    deploy: //experimental/ts/grpc_hello_world/testplan/deploy_selfheal.yaml
    endpoint:
      http:
        public: https://apitest.liukexin.com
    cases:
      - //experimental/ts/grpc_hello_world/testplan:health_test
