name: openai-llm-interface-test
description: |
  Validates that @langchain/openai ChatOpenAI exposes both native contentBlocks
  and additional_kwargs.reasoning_content when consuming a fake OpenAI endpoint.

suites:
  - name: default
    deploy: //experimental/openai_llm/testplan/deploy.yaml
    endpoint:
      http:
        public: https://apitest.liukexin.com
    cases:
      - //experimental/openai_llm/testplan:interface_test
