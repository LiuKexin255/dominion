version: "3.0"
name: alice.dev
desc: "extra secret bindings"
type: dev
services:
  - artifact:
      path: //tools/release/deploy/v2/compiler/testdata/service-with-secrets.yaml
      name: service-with-secrets
      secrets:
        db-password:
          secret: vault-db
          key: password
        api-key:
          secret: vault-api
          key: token
        unknown-secret:
          secret: vault-extra
          key: value
