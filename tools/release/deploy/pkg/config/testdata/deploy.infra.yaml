name: grpc.dev
desc: "开发环境"
type: dev
services:
  - infra:
      resource: mongodb
      profile: development
      name: grpc-hello-world-mongo
      app: grpc-hello-world
      persistence:
        enabled: true
  - infra:
      resource: redis
      profile: development
      name: grpc-hello-world-redis
      app: grpc-hello-world
