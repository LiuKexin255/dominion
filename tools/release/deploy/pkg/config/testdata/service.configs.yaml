version: "3.0"
name: service
app: grpc-hello-world
desc: grpc hello world service with configs
configs:
  - name: service_config
    data:
      - name: greeting
        value: |
          message: "hello from config"
          times: 3
        type: yaml
      - name: limits
        value: '{"maxConn": 100}'
        type: json
  - name: feature_flags
    data:
      - name: debug
        value: "false"
        type: yaml
artifacts:
  - name: service
    target: :service_image
    ports:
      - name: grpc
        port: 50051
