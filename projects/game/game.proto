syntax = "proto3";

package projects.game;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "dominion/projects/game";

// SessionService manages Session resources — the per-template container for
// a game session.
//
// Prefix Path: /api/v1/templates/{template}/sessions
service SessionService {
  // CreateSession creates a new Session under a template.
  // AIP-133: https://google.aip.dev/133
  rpc CreateSession(CreateSessionRequest) returns (Session) {
    option (google.api.http) = {
      post: "/api/v1/{parent=templates/*}/sessions"
      body: "session"
    };
    option (google.api.method_signature) = "parent,session";
  }

  // ListSessions lists Sessions under a template. AIP-132: https://google.aip.dev/132
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/{parent=templates/*}/sessions"
    };
    option (google.api.method_signature) = "parent";
  }

  // GetSession gets a Session. AIP-131: https://google.aip.dev/131
  rpc GetSession(GetSessionRequest) returns (Session) {
    option (google.api.http) = {
      get: "/api/v1/{name=templates/*/sessions/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // DeleteSession deletes a Session. AIP-135: https://google.aip.dev/135
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/{name=templates/*/sessions/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

// TeamService manages the Team resource within a Session and provides a
// bidirectional stream for real-time team communication. It replaces the
// former ProxyService/AgentService pair (clean break, spec
// 031-team-template-mode): the Team is the session's execution subject and
// its messages are partitioned per team agent.
//
// Prefix Path: /api/v1/templates/{template}/sessions/{session}
service TeamService {
  // CreateTeam creates the Team of a Session explicitly (AIP-133:
  // https://google.aip.dev/133). The Team is a per-session singleton — its
  // resource id is the literal "team" — so the request carries the parent
  // Session and the TeamProfile (full resource name) the team is built from.
  // CreateTeam is the ONLY Team creation point: GetTeam/Connect/ListMessages/
  // RefreshTeam require the Team to already exist (no lazy creation — the
  // former implicit creation with a fixed default profile is removed, spec
  // 031-team-template-mode design decision).
  rpc CreateTeam(CreateTeamRequest) returns (Team) {
    option (google.api.http) = {
      post: "/api/v1/{parent=templates/*/sessions/*}/team"
      body: "*"
    };
    option (google.api.method_signature) = "parent,profile";
  }

  // GetTeam gets the Team of a Session. AIP-131: https://google.aip.dev/131
  rpc GetTeam(GetTeamRequest) returns (Team) {
    option (google.api.http) = {
      get: "/api/v1/{name=templates/*/sessions/*/team}"
    };
    option (google.api.method_signature) = "name";
  }

  // Connect establishes a bidirectional streaming channel for team
  // communication. The client sends UserFrame (user input, operation results,
  // connectivity probes); the server sends TeamFrame (agent display content,
  // control signals, operation requests). Each frame carries exactly one
  // payload: a MessageParts batch of content or a FlowParts control batch.
  // User-input frames are routed to the team agent that accepts user input
  // (FR-032). No REST binding: bidirectional streaming RPCs are not natively
  // supported over HTTP/1.1 (AIP-127 https://google.aip.dev/127;
  // specs/035-proto-contract-refine/contracts/frame-split.md §1).
  rpc Connect(stream UserFrame) returns (stream TeamFrame);

  // ListMessages lists Messages of one team agent's partition.
  // AIP-132: https://google.aip.dev/132
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {
      get: "/api/v1/{parent=templates/*/sessions/*/team/agents/*}/messages"
    };
    option (google.api.method_signature) = "parent";
  }

  // RefreshTeam clears the session's short-term memory (messages); the
  // long-term strategy memory is unaffected (FR-018). AIP-136 custom method:
  // https://google.aip.dev/136
  rpc RefreshTeam(RefreshTeamRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/{name=templates/*/sessions/*/team}:refresh"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// PromptService manages TeamProfile resources for per-template team
// configuration. Each TeamProfile carries a typed oneof spec that is
// specialized per template (saolei: SaoleiProfile). It replaces the former
// AgentProfile/Skill management (clean break, spec 031-team-template-mode).
//
// Prefix Path: /api/v1/templates/{template}/profiles
service PromptService {
  // CreateTeamProfile creates a new TeamProfile under a template.
  // AIP-133: https://google.aip.dev/133
  rpc CreateTeamProfile(CreateTeamProfileRequest) returns (TeamProfile) {
    option (google.api.http) = {
      post: "/api/v1/{parent=templates/*}/profiles"
      body: "team_profile"
    };
    option (google.api.method_signature) = "parent,team_profile,team_profile_id";
  }

  // GetTeamProfile gets a TeamProfile. AIP-131: https://google.aip.dev/131
  rpc GetTeamProfile(GetTeamProfileRequest) returns (TeamProfile) {
    option (google.api.http) = {
      get: "/api/v1/{name=templates/*/profiles/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // ListTeamProfiles lists TeamProfiles under a template.
  // AIP-132: https://google.aip.dev/132
  rpc ListTeamProfiles(ListTeamProfilesRequest) returns (ListTeamProfilesResponse) {
    option (google.api.http) = {
      get: "/api/v1/{parent=templates/*}/profiles"
    };
    option (google.api.method_signature) = "parent";
  }

  // UpdateTeamProfile updates a TeamProfile. AIP-134: https://google.aip.dev/134
  rpc UpdateTeamProfile(UpdateTeamProfileRequest) returns (TeamProfile) {
    option (google.api.http) = {
      patch: "/api/v1/{team_profile.name=templates/*/profiles/*}"
      body: "team_profile"
    };
    option (google.api.method_signature) = "team_profile,update_mask";
  }

  // DeleteTeamProfile deletes a TeamProfile. AIP-135: https://google.aip.dev/135
  rpc DeleteTeamProfile(DeleteTeamProfileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/{name=templates/*/profiles/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

// ─── Shared Resources ──────────────────────────────────────────────────────

// Template is the top-level resource-hierarchy path segment. It is a resource
// with NO standard methods (FR-001): its concrete values are a fixed set,
// declared as constants in gameconst (not a proto enum). This message exists
// to drive protoc-gen-go-aip codegen of ParseTemplateName, so resource
// name parsing is fully codegen-driven (no hand-written parent parser). The
// former Session.template / TeamProfile.template resource-body fields were
// removed — the template is carried by the name pattern path segments only
// (AIP-124; specs/035-proto-contract-refine/data-model.md §1.1/§1.2).
message Template {
  option (google.api.resource) = {
    type: "game.liukexin.com/Template"
    pattern: "templates/{template}"
    singular: "template"
    plural: "templates"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
}

// Session is the per-template container for a game session.
message Session {
  option (google.api.resource) = {
    type: "game.liukexin.com/Session"
    pattern: "templates/{template}/sessions/{session}"
    plural: "sessions"
    singular: "session"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The template and the session id are carried by the name pattern path
  // segments (AIP-124: https://google.aip.dev/124); fields 2 (template) and
  // 3 (session_id) removed (clean break,
  // specs/035-proto-contract-refine/data-model.md §1.1).
  reserved 2, 3;
  reserved "template", "session_id";

  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// TeamAgent describes one agent inside a Team. The agent name is known to
// the template's graph schema (saolei: player/planner); it is not a
// standalone resource — it is the message-partition and frame-routing
// dimension (FR-005/FR-023).
message TeamAgent {
  // Agent name within the team (e.g. player/planner).
  string name = 1;
  // Whether the agent accepts user input (FR-031). saolei: player=true,
  // planner=false.
  bool accepts_user_input = 2;
}

// Team is the execution subject of a Session, replacing the former Agent
// resource (clean break, FR-003). It is created explicitly via CreateTeam
// (AIP-133) — the only creation point — and cannot be created lazily or
// independently; its agents are exported from the template's graph schema
// definition (typed, not hard-coded by clients).
message Team {
  option (google.api.resource) = {
    type: "game.liukexin.com/Team"
    pattern: "templates/{template}/sessions/{session}/team"
    plural: "teams"
    singular: "team"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  repeated TeamAgent agents = 2;
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// TeamProfile is the per-template team configuration resource, replacing the
// former AgentProfile/Skill resources (clean break, FR-006/FR-007). The oneof
// spec variant MUST be consistent with the template derived from the name
// path segment — the handler validates the consistency (no implicit rules).
// The former resource-body template field is removed
// (specs/035-proto-contract-refine/data-model.md §1.2). The spec is a typed
// oneof, never a blob (directive: typed oneof/enum, no unformatted generic).
message TeamProfile {
  option (google.api.resource) = {
    type: "game.liukexin.com/TeamProfile"
    pattern: "templates/{template}/profiles/{profile}"
    plural: "teamProfiles"
    singular: "teamProfile"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The template is carried by the name pattern path segment (AIP-124:
  // https://google.aip.dev/124); the oneof spec consistency check derives it
  // from the name/parent path segment instead of the removed body field.
  // field 2 (template) removed (clean break,
  // specs/035-proto-contract-refine/data-model.md §1.2).
  reserved 2;
  reserved "template";

  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Template-specialized configuration (typed oneof). Exactly one variant
  // must be set, matching the template path segment of the resource name.
  oneof spec {
    SaoleiProfile saolei = 10;
  }
}

// SaoleiProfile is the saolei-template TeamProfile specialization: player and
// planner LLM model selection plus each agent's optional base prompt (empty =
// unset = fall back to the template default base, FR-034 of
// specs/031-team-template-mode/spec.md). Tools/MCP are fixed by the template
// itself and are NOT configurable here (FR-028).
message SaoleiProfile {
  string player_model = 1;
  string planner_model = 2;
  // The player's base prompt; empty = unset = fall back to the template
  // default base (the saolei skill body is always appended by the template,
  // FR-034 of specs/031-team-template-mode/spec.md).
  string player_prompt = 3;
  // The planner's base prompt; empty = unset = fall back to the template
  // default base (FR-034 of specs/031-team-template-mode/spec.md).
  string planner_prompt = 4;
}

// MessageRole identifies the sender role of a persisted conversation Message
// (history). Frames are direction-split (UserFrame inbound / TeamFrame
// outbound), so the transport no longer needs a sender enum; Message keeps a
// role for bubble alignment and history replay (FR-020,
// specs/035-proto-contract-refine/contracts/frame-split.md §4). tool messages
// are unified as AGENT, aligned with the live stream's tool_result frames
// (the former FRAME_SENDER_SYSTEM had no counterpart in the live direction).
enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_AGENT = 2;
}

// ImageEncoding specifies the encoding format for image data.
enum ImageEncoding {
  IMAGE_ENCODING_UNSPECIFIED = 0;
  IMAGE_ENCODING_PNG = 1;
}

// MouseClickAction lists the click types accepted by MouseClickPart. MOVE is
// absent on purpose: moving the cursor is expressed by MouseMovePart, so a
// click part cannot structurally carry a move action.
// (Replaces the former bundled mouse-action enum, which combined MOVE + clicks.)
enum MouseClickAction {
  MOUSE_CLICK_ACTION_UNSPECIFIED = 0;
  MOUSE_CLICK_ACTION_LEFT_CLICK = 1;
  MOUSE_CLICK_ACTION_LEFT_DOUBLE_CLICK = 2;
  MOUSE_CLICK_ACTION_RIGHT_CLICK = 3;
  MOUSE_CLICK_ACTION_RIGHT_DOUBLE_CLICK = 4;
  MOUSE_CLICK_ACTION_LEFT_RIGHT_PRESS = 5;
}

// ToolResultStatus indicates the outcome of an executed tool operation.
// (Renamed from AgentOperationResultStatus for coherence with ToolResultPart.)
enum ToolResultStatus {
  TOOL_RESULT_STATUS_UNSPECIFIED = 0;
  TOOL_RESULT_STATUS_SUCCEEDED = 1;
  TOOL_RESULT_STATUS_FAILED = 2;
}

// MouseInputMethod selects the desktop's mouse-execution path for a mouse
// Part (AIP-126 enumeration; values prefixed with the enum name to avoid
// package-level collisions). SIMULATED moves the OS cursor (SetCursorPos)
// and injects button events via SendInput with screen-absolute coordinates.
// WINDOW_MESSAGE posts WM_* button messages to the bound window's HWND
// without moving the cursor, using window-client coordinates packed into
// lParam. UNSPECIFIED is treated as SIMULATED so existing mouse Parts keep
// their prior behavior (spec 018-saolei-mcp FR-004c; AIP-180 — a new
// client-populated field defaults to the pre-existing behavior).
enum MouseInputMethod {
  MOUSE_INPUT_METHOD_UNSPECIFIED = 0;
  MOUSE_INPUT_METHOD_SIMULATED = 1;
  MOUSE_INPUT_METHOD_WINDOW_MESSAGE = 2;
}

// KeyboardKey lists the keys accepted by KeyboardPressPart (AIP-126
// enumeration; values prefixed with the enum name). The set starts with F2 —
// the minesweeper new-game shortcut — and is extensible as future tools
// require additional keys.
enum KeyboardKey {
  KEYBOARD_KEY_UNSPECIFIED = 0;
  KEYBOARD_KEY_F2 = 1;
}

// ─── Content Part Model ────────────────────────────────────────────────────
//
// The content model is split into two disjoint categories
// (specs/023-saolei-mcp-refine/contracts/content-model-contract.md §1..§6;
// spec 023 C3 / FR-001..FR-004):
//
//   - MessagePart (display only) — rendered in the conversation and carried by
//     Message (history) and TeamFrame.message_parts (live): text, thinking,
//     image, tool_call (the model's semantic tool invocation), tool_result.
//   - FlowPart (control only — NEVER rendered in the conversation) — drives
//     desktop execution (mouse/keyboard operations) and turn control
//     (wait/warn/status). A FlowPart is consumed, not displayed
//     (spec 023 FR-005).
//
// This split is structural rather than a render-time filter, so a FlowPart can
// never accidentally render as a chat entry. Live frames and persisted history
// share the identical MessageParts shape, so live view and history render
// identically.

// ToolCallPart carries the model's tool invocation as display content. It is
// the semantic counterpart of the physical FlowPart operation a tool dispatches:
// the conversation shows the tool name + arguments (this part), while the
// desktop executes the operation (a FlowPart). tool_id links the call to its
// subsequent tool_result MessagePart and to the FlowPart operation it dispatches
// (spec 023 FR-002/FR-008). args_json is the model's arguments verbatim
// (JSON.stringify(tool_call.args)); display-only.
message ToolCallPart {
  string tool_id   = 1;
  string name      = 2;
  string args_json = 3;
}

// MessagePart is one display-only content block. The conversation renders only
// MessageParts; they are the sole content of Message (history) and the
// message_parts payload of TeamFrame (live). A tool call and its result are
// both MessageParts (tool_call, tool_result) linked by tool_id.
message MessagePart {
  oneof kind {
    TextPart       text        = 1;
    ThinkingPart   thinking    = 2;
    ImagePart      image       = 3;
    ToolCallPart   tool_call   = 4;  // NEW (spec 023 FR-002)
    ToolResultPart tool_result = 5;
  }
}

// FlowPart is one control-only block. It drives desktop execution (mouse/
// keyboard operations), carries the operation-execution result back to the
// agent (flow_result), and conveys turn control (wait/warn/status); it is NEVER
// rendered as a conversation entry (spec 023 FR-005; spec 025 FR-023/FR-024).
// The operation kinds reuse the existing operation Part messages verbatim
// (MouseMovePart, MouseClickPart, KeyboardPressPart, MouseMoveAndClickPart —
// fields unchanged from spec 018). The signal kinds (wait/warn/status) reuse
// the existing signal messages. flow_result is the control-channel counterpart
// to the operation request kinds, reported by the desktop over this same
// control channel (spec 025 FR-023; data-model.md §1).
message FlowPart {
  oneof kind {
    MouseMovePart         mouse_move           = 1;
    MouseClickPart        mouse_click          = 2;
    KeyboardPressPart     keyboard_press       = 3;
    MouseMoveAndClickPart mouse_move_and_click = 4;
    WaitSignal            wait                 = 5;
    WarnSignal            warn                 = 6;
    StatusSignal          status               = 7;
    // NEW (spec 025 FR-023): the desktop's outcome of an executed FlowPart
    // operation, reported on the control channel.
    FlowResultPart        flow_result          = 8;
    // NEW (spec 030 FR-008): agent-pushed per-session queue-depth signal so
    // the desktop can render pending messages and transition them to normal
    // on consume. Additive oneof variant (field tag 9, next free after
    // flow_result). See
    // specs/030-queued-chat-input/contracts/queue-channel-contract.md §2.
    QueueSignal           queue                = 9;
  }
}

// MessageParts is the display payload: an ordered list of MessagePart. Carried
// by TeamFrame.message_parts (live) and Message.content (history) — identical
// shape, so live and history render identically (spec 023 FR-009).
message MessageParts {
  repeated MessagePart parts = 1;
}

// FlowParts is the control payload: an ordered list of FlowPart. Carried by
// TeamFrame.flow_parts. Never appears in Message.content.
message FlowParts {
  repeated FlowPart parts = 1;
}

// TextPart carries visible text content.
message TextPart {
  string content = 1;
}

// ThinkingPart carries reasoning / intermediate process content.
message ThinkingPart {
  string content = 1;
}

// ImagePart carries an image (e.g. a captured screenshot).
message ImagePart {
  ImageEncoding encoding = 1;
  bytes data = 2;
  int32 width_px = 3;
  int32 height_px = 4;
  double scale_factor = 5;
  string window_title = 6;
}

// MouseMovePart requests the desktop move the cursor to image-relative
// coordinates. tool_id links the request to its ToolResultPart.
message MouseMovePart {
  string tool_id = 1;
  int32 x_px = 2;
  int32 y_px = 3;
  MouseInputMethod method = 4;
}

// MouseClickPart requests the desktop perform a click at the current cursor
// position. tool_id links the request to its ToolResultPart.
message MouseClickPart {
  string tool_id = 1;
  MouseClickAction click = 2;
  MouseInputMethod method = 3;
}

// KeyboardPressPart requests the desktop press a single key on the bound
// window. tool_id links the request to its ToolResultPart and is stamped by
// OperationBridge.dispatch. The desktop posts the key to the bound HWND
// (e.g. WM_KEYDOWN/WM_KEYUP); the concrete Win32 mechanism is the desktop's
// responsibility (spec 018-saolei-mcp FR-004a). Tool-agnostic: the Part
// carries a key identifier only, never higher-level tool semantics.
message KeyboardPressPart {
  string tool_id = 1;
  KeyboardKey key = 2;
}

// MouseMoveAndClickPart requests the desktop atomically move to and click a
// target in one operation. x_px/y_px are window-client coordinates when
// method = WINDOW_MESSAGE (packed into lParam, no cursor movement); they are
// screenshot-relative screen-target coordinates when method = SIMULATED.
// click reuses MouseClickAction. method selects the desktop execution path.
// (spec 018-saolei-mcp FR-004b/FR-004c; research.md D5.)
message MouseMoveAndClickPart {
  string tool_id = 1;
  int32 x_px = 2;
  int32 y_px = 3;
  MouseClickAction click = 4;
  MouseInputMethod method = 5;
}

// ToolResultPart carries the outcome of an executed tool operation, reported
// by the desktop. tool_id matches the originating MouseMovePart /
// MouseClickPart. Generic across tools: move and click results are
// shape-identical (status + message + screenshot).
message ToolResultPart {
  string tool_id = 1;
  ToolResultStatus status = 2;
  string message = 3;
  ImagePart screenshot = 4;
}

// FlowResultPart carries the desktop's outcome of an executed FlowPart
// operation (mouse/keyboard), reported back over the CONTROL channel
// (FlowParts). It is the operation-channel counterpart to the operation
// request kinds and corresponds shape-wise to ToolResultPart — but it is a
// FlowPart kind, NEVER rendered in the conversation (spec 025 FR-023/FR-024).
// The agent consumes it (OperationBridge.handleResult) and translates it into
// the display tool_result MessagePart per tool (text board for saolei;
// text + screenshot for mouse tools). See
// specs/025-desktop-image-state-refine/contracts/flow-result-contract.md.
message FlowResultPart {
  // Operation-channel id (bridge-minted by OperationBridge.dispatch), matching
  // the originating operation FlowPart's tool_id. Used only for dispatch↔result
  // correlation; unrelated to the conversation tool_call.id (023 C13).
  string tool_id = 1;
  // Operation outcome. Reuses ToolResultStatus (UNSPECIFIED/SUCCEEDED/FAILED).
  ToolResultStatus status = 2;
  // Human/agent-readable outcome detail (e.g. "ok" or an error message).
  string message = 3;
  // Post-action screenshot (control-channel carrier). Consumed by the agent
  // for recognition (saolei) or copied into a mouse tool's display tool_result.
  ImagePart screenshot = 4;
}

// ─── Control Signals ──────────────────────────────────────────────────────
//
// WaitSignal / WarnSignal / StatusSignal carry turn-control signals. Per the
// content-model split (spec 023 C3 / FR-003) they are FlowPart kinds — carried
// by TeamFrame.flow_parts and never rendered as conversation entries. Their
// message shapes are unchanged from spec 018.
//
// QueueSignal (spec 030 FR-008) is an additive FlowPart signal that carries
// the per-session queue depth; see specs/030-queued-chat-input/contracts/
// queue-channel-contract.md §2.

// WaitSignal indicates the agent finished a turn and is waiting for input.
message WaitSignal {
  string reason = 1;
}

// WarnSignal carries a warning / recoverable error for the current turn.
message WarnSignal {
  string message = 1;
  string code = 2;
}

// StatusSignalStatus is the lifecycle / connectivity status of an agent turn.
enum StatusSignalStatus {
  STATUS_SIGNAL_STATUS_UNSPECIFIED = 0;
  // ACTIVE: heartbeat sent every 5s while the agent is working (model
  // invocation, tool execution) but has not yet started streaming output.
  STATUS_SIGNAL_STATUS_ACTIVE = 1;
  // IDLE: the agent is bound to a profile and ready for input.
  STATUS_SIGNAL_STATUS_IDLE = 2;
}

// StatusSignal carries a connectivity / lifecycle status. The agent emits
// ACTIVE heartbeats during a turn (before LLM output starts); the desktop
// watches for them and considers the agent lost if none arrive within 10s.
message StatusSignal {
  StatusSignalStatus status = 1;
}

// QueueSignal carries the per-session queue depth: the number of user messages
// currently buffered (waiting to be combined into the next agent turn). The
// agent pushes it over the flow channel whenever the depth changes (event-
// driven, not polled); the desktop renders pending messages and transitions
// them to normal on consume (spec 030 FR-008/FR-009). Additive FlowPart kind;
// see specs/030-queued-chat-input/contracts/queue-channel-contract.md §2.
message QueueSignal {
  // Current number of user messages buffered in the per-session queue
  // (waiting to be combined into the next agent turn).
  int32 queued_count = 1;
}

// ─── Frame & Message Envelopes ─────────────────────────────────────────────

// UserFrame is the inbound transport unit (desktop client → server) exchanged
// over WebSocket and gRPC streams. A frame carries exactly one payload: a
// batch of display blocks (MessageParts — user message content) OR a batch of
// control blocks (FlowParts — operation results, connectivity probes). It
// excludes the outbound-only envelope fields (frame_id/create_time/sender):
// the server does not consume them on the inbound direction
// (specs/035-proto-contract-refine/contracts/frame-split.md §2).
message UserFrame {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string template_id = 2 [(google.api.field_behavior) = REQUIRED];
  // The team agent the user input targets (e.g. player/planner); empty falls
  // back to the accepts-user-input agent. Only message_parts (user message)
  // frames need it; flow_parts (operation result/probe) may omit it.
  string agent = 3;

  // Exactly one payload per frame: a batch of display blocks OR a batch of
  // control blocks (specs/023-saolei-mcp-refine/contracts/content-model-contract.md §4).
  oneof payload {
    MessageParts message_parts = 10;
    FlowParts    flow_parts    = 11;
  }
}

// TeamFrame is the outbound transport unit (server → desktop client)
// exchanged over WebSocket and gRPC streams. A frame carries exactly one
// payload: a batch of display blocks (MessageParts — agent display content)
// OR a batch of control blocks (FlowParts — wait/warn/status/queue signals +
// mouse/keyboard operation requests). Every send point MUST set the envelope
// fields session_id/template_id/frame_id/create_time (FR-013,
// specs/035-proto-contract-refine/contracts/frame-split.md §3.3).
message TeamFrame {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string template_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Frame unique id (UUID) — the frontend dedupes frames by it.
  string frame_id = 3;
  // Frame timestamp — the frontend shows it on bubbles.
  google.protobuf.Timestamp create_time = 4;
  // The team agent that produced the frame (e.g. player/planner); replaces
  // the former agent_profile_name (clean break, spec 031-team-template-mode
  // D12 / FR-023). Field 5 keeps its semantics; the number is new because the
  // frame was split (clean break, specs/035-proto-contract-refine/research.md
  // R2).
  string agent = 5;
  // Message role for bubble alignment: live message_parts frames are always
  // AGENT; SeedFromHistory replay frames carry the Message.role copy; flowParts
  // frames are UNSPECIFIED (specs/035-proto-contract-refine/research.md R3).
  MessageRole role = 6;

  // Exactly one payload per frame: a batch of display blocks OR a batch of
  // control blocks (specs/023-saolei-mcp-refine/contracts/content-model-contract.md §4).
  oneof payload {
    MessageParts message_parts = 10;
    FlowParts    flow_parts    = 11;
  }
}

// Message is one normalized conversation entry reconstructed from checkpoint
// state (history), partitioned per team agent (FR-005). Its content is a
// MessageParts (display blocks only) — the identical shape a live
// TeamFrame's message_parts payload carries, so history and live view render
// identically. Control blocks (FlowParts) never appear here (spec 023 FR-004).
message Message {
  option (google.api.resource) = {
    type: "game.liukexin.com/Message"
    pattern: "templates/{template}/sessions/{session}/team/agents/{agent}/messages/{message}"
    plural: "messages"
    singular: "message"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string message_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // MessageRole role = 3 — replaced the former FrameSender sender field
  // (field number kept; FR-020,
  // specs/035-proto-contract-refine/contracts/frame-split.md §5).
  MessageRole role = 3;
  // The team agent this message belongs to; matches the {agent} path segment.
  string agent = 4;
  google.protobuf.Timestamp create_time = 5;

  // Content blocks (display only) — identical shape to TeamFrame's
  // message_parts payload (specs/023-saolei-mcp-refine/contracts/content-model-contract.md §5).
  MessageParts content = 6;
}

// ListMessagesRequest lists Messages under one team agent's partition
// (parent "templates/{template}/sessions/{session}/team/agents/{agent}").
// AIP-132: https://google.aip.dev/132
message ListMessagesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/Message"
    }
  ];
  int32 page_size = 2;
  string page_token = 3;
}

// ListMessagesResponse is the response for listing Messages.
message ListMessagesResponse {
  repeated Message messages = 1;
  string next_page_token = 2;
}

// ─── Request Messages ──────────────────────────────────────────────────────

// CreateSessionRequest creates a Session under a template. AIP-133:
// https://google.aip.dev/133. session_id is empty when the caller defers ID
// generation to the server.
message CreateSessionRequest {
  // The template to create the session in. Format: templates/{template}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/Session"
    }
  ];
  string session_id = 2;
  Session session = 3 [(google.api.field_behavior) = REQUIRED];
}

// ListSessionsRequest lists Sessions under a template. AIP-132:
// https://google.aip.dev/132
message ListSessionsRequest {
  // The template to list sessions from. Format: templates/{template}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/Session"
    }
  ];
  int32 page_size = 2;
  string page_token = 3;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2;
}

message GetSessionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Session"
    }
  ];
}

message DeleteSessionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Session"
    }
  ];
}

message GetTeamRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Team"
    }
  ];
}

// CreateTeamRequest creates the Team of a Session (AIP-133:
// https://google.aip.dev/133). The Team is a per-session singleton (resource
// id = the literal "team"), so there is no resource body and no
// team_id field: the parent Session plus the TeamProfile (full resource
// name, AIP-122) identify the team and its configuration. The profile's
// template segment MUST match the parent's template segment — the handler
// validates the consistency (no implicit rules).
message CreateTeamRequest {
  // The session under which the Team is created.
  // Format: templates/{template}/sessions/{session}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/Team"
    }
  ];
  // The TeamProfile the team is built from (resolves the template's
  // player/planner models). Full resource name so the template is explicit
  // and validated against the parent.
  // Format: templates/{template}/profiles/{profile}
  string profile = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/TeamProfile"
    }
  ];
}

// RefreshTeamRequest refreshes a Session's Team (clears short-term memory).
// AIP-136 custom method: https://google.aip.dev/136
message RefreshTeamRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Team"
    }
  ];
}

// CreateTeamProfileRequest creates a TeamProfile under a template.
// AIP-133: https://google.aip.dev/133
message CreateTeamProfileRequest {
  // The template to create the profile in. Format: templates/{template}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/TeamProfile"
    }
  ];
  string team_profile_id = 2 [(google.api.field_behavior) = REQUIRED];
  TeamProfile team_profile = 3 [(google.api.field_behavior) = REQUIRED];
}

message GetTeamProfileRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/TeamProfile"
    }
  ];
}

// ListTeamProfilesRequest lists TeamProfiles under a template.
// AIP-132: https://google.aip.dev/132
message ListTeamProfilesRequest {
  // The template to list profiles from. Format: templates/{template}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/TeamProfile"
    }
  ];
  int32 page_size = 2;
  string page_token = 3;
}

message ListTeamProfilesResponse {
  repeated TeamProfile team_profiles = 1;
  string next_page_token = 2;
}

// UpdateTeamProfileRequest updates a TeamProfile. AIP-134:
// https://google.aip.dev/134. The resource's name field (TeamProfile.name,
// pattern templates/{template}/profiles/{profile}) is the target identity,
// surfaced in the HTTP path via {team_profile.name=...}. update_mask supports
// oneof-member paths (e.g. saolei.player_model / saolei.planner_model).
message UpdateTeamProfileRequest {
  TeamProfile team_profile = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteTeamProfileRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/TeamProfile"
    }
  ];
}
