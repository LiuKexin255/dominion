syntax = "proto3";

package projects.game;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "dominion/projects/game";

// SessionService manages Session resources — the top-level container for a
// game session.
//
// Prefix Path: /api/v1/sessions
service SessionService {
  // CreateSession creates a new Session resource.
  rpc CreateSession(CreateSessionRequest) returns (Session) {
    option (google.api.http) = {
      post: "/api/v1/sessions"
      body: "*"
    };
  }

  // ListSessions lists all Sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sessions"
    };
  }

  // GetSession returns the Session resource identified by name.
  rpc GetSession(GetSessionRequest) returns (Session) {
    option (google.api.http) = {
      get: "/api/v1/{name=sessions/*}"
    };

    option (google.api.method_signature) = "name";
  }

  // DeleteSession deletes the Session resource and all owned resources.
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/{name=sessions/*}"
    };

    option (google.api.method_signature) = "name";
  }
}

// ProxyService manages Agent resources within a Session and provides a
// bidirectional stream for real-time agent communication.
//
// Prefix Path: /api/v1/sessions/{session}/agent
service ProxyService {
  // CreateAgent creates an Agent resource under the specified parent Session.
  rpc CreateAgent(CreateAgentRequest) returns (Agent) {
    option (google.api.http) = {
      post: "/api/v1/{parent=sessions/*}/agent"
      body: "agent"
    };

    option (google.api.method_signature) = "parent,agent";
  }

  // GetAgent returns the Agent resource identified by name.
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {
      get: "/api/v1/{name=sessions/*/agent}"
    };

    option (google.api.method_signature) = "name";
  }

  // DeleteAgent deletes the Agent resource identified by name.
  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/{name=sessions/*/agent}"
    };

    option (google.api.method_signature) = "name";
  }

  // ConnectAgent establishes a bidirectional streaming channel for agent
  // communication. Messages are exchanged as AgentFrame units.
  rpc ConnectAgent(stream AgentFrame) returns (stream AgentFrame);
}

// AgentService provides agent-side operations and a bidirectional stream for
// agent-to-agent communication.
//
// Prefix Path: /api/v1/agents
service AgentService {
  // CreateAgent creates an agent for a given session.
  rpc CreateAgent(AgentCreateRequest) returns (Agent);

  // GetAgent returns the Agent resource for a session.
  rpc GetAgent(AgentGetRequest) returns (Agent);

  // DeleteAgent deletes the agent for a given session.
  rpc DeleteAgent(AgentDeleteRequest) returns (google.protobuf.Empty);

  // Connect establishes a bidirectional streaming channel for agent-to-agent
  // communication. Messages are exchanged as AgentFrame units.
  rpc Connect(stream AgentFrame) returns (stream AgentFrame);
}

// PromptService manages AgentProfile and Skill resources for agent
// configuration.
//
// Prefix Path: /api/v1/prompts
service PromptService {
  // CreateAgentProfile creates a new AgentProfile resource.
  rpc CreateAgentProfile(CreateAgentProfileRequest) returns (AgentProfile) {
    option (google.api.http) = {
      post: "/api/v1/prompts/agentProfiles"
      body: "*"
    };
  }

  // GetAgentProfile returns the AgentProfile resource identified by name.
  rpc GetAgentProfile(GetAgentProfileRequest) returns (AgentProfile) {
    option (google.api.http) = {
      get: "/api/v1/prompts/agentProfiles/{agent_profile_name}"
    };
  }

  // ListAgentProfiles lists all AgentProfile resources.
  rpc ListAgentProfiles(ListAgentProfilesRequest) returns (ListAgentProfilesResponse) {
    option (google.api.http) = {
      get: "/api/v1/prompts/agentProfiles"
    };
  }

  // DeleteAgentProfile deletes the AgentProfile resource identified by name.
  rpc DeleteAgentProfile(DeleteAgentProfileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/prompts/agentProfiles/{agent_profile_name}"
    };
  }

  // CreateSkill creates a new Skill resource.
  rpc CreateSkill(CreateSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/api/v1/prompts/skills"
      body: "*"
    };
  }

  // GetSkill returns the Skill resource identified by name.
  rpc GetSkill(GetSkillRequest) returns (Skill) {
    option (google.api.http) = {
      get: "/api/v1/prompts/skills/{skill_name}"
    };
  }

  // ListSkills lists all Skill resources.
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (google.api.http) = {
      get: "/api/v1/prompts/skills"
    };
  }

  // DeleteSkill deletes the Skill resource identified by name.
  rpc DeleteSkill(DeleteSkillRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/prompts/skills/{skill_name}"
    };
  }
}

// ─── Shared Messages ──────────────────────────────────────────────────────

// Session is the top-level container for a game session.
message Session {
  option (google.api.resource) = {
    type: "game.liukexin.com/Session"
    pattern: "sessions/{session}"
    plural: "sessions"
    singular: "session"
  };

  // The resource name of the session, e.g. "sessions/abc123".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The unique identifier for this session.
  string session_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The timestamp when this session was created.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Agent represents an agent within a game session, including ownership
// information.
message Agent {
  option (google.api.resource) = {
    type: "game.liukexin.com/Agent"
    pattern: "sessions/{session}/agent"
    plural: "agents"
    singular: "agent"
  };

  // The resource name of the agent, e.g. "sessions/abc123/agent".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The session this agent belongs to.
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The index of the owner within the session.
  int32 owner_index = 3 [(google.api.field_behavior) = REQUIRED];

  // The identifier of the owner.
  string owner = 4 [(google.api.field_behavior) = REQUIRED];

  // The timestamp when this agent was created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The agent profile name used to configure this agent's behavior.
  string agent_profile_name = 6;
}

// FrameSender identifies the originator of an AgentFrame.
enum FrameSender {
  FRAME_SENDER_UNSPECIFIED = 0;
  FRAME_SENDER_USER = 1;
  FRAME_SENDER_AGENT = 2;
  FRAME_SENDER_SYSTEM = 3;
}

// AgentFrame is the minimal transport unit exchanged over WebSocket and gRPC
// streams.
message AgentFrame {
  // The session this frame belongs to.
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];

  // The unique identifier for this frame.
  string frame_id = 2;

  // The timestamp when this frame was created.
  google.protobuf.Timestamp create_time = 3;

  // The invoke identifier linking related frames within an invoke cycle.
  string invoke_id = 4;
  // Monotonically increasing sequence number within an invoke.
  int64 sequence = 5;

  // The frame payload, one of the following types.
  oneof payload {
    // Status update from the agent.
    AgentStatusFrame status = 10;
    // Echo response for connectivity check.
    AgentEchoFrame echo = 11;
    // Screenshot capture from the agent.
    AgentScreenshotFrame screenshot = 12;
    // Acknowledgement of a received frame.
    AgentAckFrame ack = 13;
    // Text output from the agent for desktop display.
    AgentTextFrame text = 14;
    // Thinking or intermediate process content from the agent.
    AgentThinkingFrame thinking = 15;
    // An operation request from the agent for desktop to execute.
    AgentOperationFrame operation = 16;
    // Warning or error information about protocol state.
    AgentWarnFrame warn = 17;
    // Agent is waiting for input or instruction.
    AgentWaitFrame wait = 18;
    // Agent is requesting a screenshot from desktop.
    AgentScreenshotRequestFrame screenshot_request = 19;
  }

  // The originator of this frame (user, agent, or system).
  FrameSender sender = 20;
}

// AgentStatusFrame reports the current status string of an agent.
message AgentStatusFrame {
  // The current status string.
  string status = 1;
}

// AgentEchoFrame is used for connectivity checks, echoing back arbitrary data.
message AgentEchoFrame {
  // The echoed data bytes.
  bytes data = 1;
}

// AgentAckFrame acknowledges receipt of a specific frame.
message AgentAckFrame {
  // The frame_id of the frame being acknowledged.
  string ack_frame_id = 1;

  // Optional message accompanying the acknowledgement.
  string message = 2;
}

// AgentTextFrame carries text output from the agent for desktop display.
message AgentTextFrame {
  string content = 1;
}

// AgentThinkingFrame carries thinking or intermediate process output.
message AgentThinkingFrame {
  string content = 1;
}

// AgentWarnFrame carries warning or error information.
message AgentWarnFrame {
  string message = 1;
  string code = 2;
}

// ImageEncoding specifies the encoding format for image data.
enum ImageEncoding {
  IMAGE_ENCODING_UNSPECIFIED = 0;
  IMAGE_ENCODING_PNG = 1;
}

// AgentMouseButton specifies the mouse button for an operation.
enum AgentMouseButton {
  AGENT_MOUSE_BUTTON_UNSPECIFIED = 0;
  LEFT = 1;
  RIGHT = 2;
}

// AgentMouseClickType specifies the type of mouse click.
enum AgentMouseClickType {
  AGENT_MOUSE_CLICK_TYPE_UNSPECIFIED = 0;
  SINGLE = 1;
  DOUBLE = 2;
}

// AgentScreenshotFrame carries a screenshot capture from the agent's desktop.
message AgentScreenshotFrame {
  // The unique identifier for this capture.
  string capture_id = 1;

  // The encoding format of the image data (e.g. PNG).
  ImageEncoding encoding = 2;

  // The raw image bytes. Over protojson this is base64-encoded.
  bytes data = 3;

  // The width of the captured image in pixels.
  int32 width_px = 4;

  // The height of the captured image in pixels.
  int32 height_px = 5;

  // The DPI scale factor of the captured display.
  double scale_factor = 6;

  // The title of the window that was captured.
  string window_title = 7;

  // The timestamp when the screenshot was captured.
  google.protobuf.Timestamp capture_time = 8;

  // The unique identifier for this screenshot.
  string screenshot_id = 9;
}

// AgentOperationFrame represents an operation request from the agent.
message AgentOperationFrame {
  string operation_id = 1;
  string screenshot_id = 2;
  oneof operation {
    AgentMouseOperation mouse = 10;
    AgentKeyboardOperation keyboard = 11;
  }
}

// AgentMouseOperation specifies a mouse click operation.
message AgentMouseOperation {
  AgentMouseButton button = 1;
  AgentMouseClickType click_type = 2;
  int32 x_px = 3;
  int32 y_px = 4;
}

// AgentKeyboardOperation specifies a keyboard key press operation.
message AgentKeyboardOperation {
  string key_codes = 1;
}

// AgentWaitFrame indicates the agent is waiting (e.g. for user instruction).
message AgentWaitFrame {
  // The reason the agent is waiting.
  string reason = 1;
}

// AgentScreenshotRequestFrame requests a new screenshot from the desktop.
message AgentScreenshotRequestFrame {
  // The reason for requesting the screenshot.
  string reason = 1;
}

// AgentProfile describes the configuration for creating an agent.
message AgentProfile {
  // The resource name, e.g. "agentProfiles/my-profile".
  string name = 1;
  // The business identifier for this profile.
  string agent_profile_name = 2;
  // The model name to use.
  string model = 3;
  // The system prompt for the agent.
  string system_prompt = 4;
  // Names of skills referenced by this profile.
  repeated string skill_names = 5;
  // Names of MCP servers referenced by this profile.
  repeated string mcp_names = 6;
  // Whether this profile is enabled.
  bool enabled = 7;
  // Timestamp of creation.
  google.protobuf.Timestamp create_time = 8;
  // Timestamp of last update.
  google.protobuf.Timestamp update_time = 9;
}

// Skill represents a tool-independent skill definition.
message Skill {
  // The resource name, e.g. "skills/my-skill".
  string name = 1;
  // The business identifier for this skill.
  string skill_name = 2;
  // The skill content (text).
  string content = 3;
  // Whether this skill is enabled.
  bool enabled = 4;
  // Timestamp of creation.
  google.protobuf.Timestamp create_time = 5;
  // Timestamp of last update.
  google.protobuf.Timestamp update_time = 6;
}

// ─── Request Messages ─────────────────────────────────────────────────────

// CreateSessionRequest is the request to create a new Session.
message CreateSessionRequest {}

// ListSessionsRequest is the request to list Sessions.
message ListSessionsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// ListSessionsResponse is the response for listing Sessions.
message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2;
}

// GetSessionRequest is the request to retrieve a Session by name.
message GetSessionRequest {
  // The resource name of the session, e.g. "sessions/abc123".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Session"
    }
  ];
}

// DeleteSessionRequest is the request to delete a Session by name.
message DeleteSessionRequest {
  // The resource name of the session, e.g. "sessions/abc123".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Session"
    }
  ];
}

// CreateAgentRequest is the request to create an Agent under a parent Session.
message CreateAgentRequest {
  // The parent session resource name, e.g. "sessions/abc123".
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/Agent"
    }
  ];

  // The Agent resource to create.
  Agent agent = 2 [(google.api.field_behavior) = REQUIRED];

  // The agent profile name to use for creating the agent.
  string agent_profile_name = 3;
}

// GetAgentRequest is the request to retrieve an Agent by name.
message GetAgentRequest {
  // The resource name of the agent, e.g. "sessions/abc123/agent".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Agent"
    }
  ];
}

// DeleteAgentRequest is the request to delete an Agent by name.
message DeleteAgentRequest {
  // The resource name of the agent, e.g. "sessions/abc123/agent".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Agent"
    }
  ];
}

// AgentCreateRequest is the request to create an agent for a session.
message AgentCreateRequest {
  // The session identifier.
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];

  // The agent profile name to use for creating the agent.
  string agent_profile_name = 2;
}

// AgentDeleteRequest is the request to delete an agent for a session.
message AgentDeleteRequest {
  // The session identifier.
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// AgentGetRequest is the request to get an agent for a session.
message AgentGetRequest {
  // The session identifier.
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// CreateAgentProfileRequest is the request to create an AgentProfile.
message CreateAgentProfileRequest {
  string agent_profile_name = 1 [(google.api.field_behavior) = REQUIRED];
  string model = 2;
  string system_prompt = 3;
  repeated string skill_names = 4;
  repeated string mcp_names = 5;
  bool enabled = 6;
}

// GetAgentProfileRequest is the request to retrieve an AgentProfile.
message GetAgentProfileRequest {
  string agent_profile_name = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListAgentProfilesRequest is the request to list AgentProfiles.
message ListAgentProfilesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// ListAgentProfilesResponse is the response for listing AgentProfiles.
message ListAgentProfilesResponse {
  repeated AgentProfile agent_profiles = 1;
  string next_page_token = 2;
}

// DeleteAgentProfileRequest is the request to delete an AgentProfile.
message DeleteAgentProfileRequest {
  string agent_profile_name = 1 [(google.api.field_behavior) = REQUIRED];
}

// CreateSkillRequest is the request to create a Skill.
message CreateSkillRequest {
  string skill_name = 1 [(google.api.field_behavior) = REQUIRED];
  string content = 2;
  bool enabled = 3;
}

// GetSkillRequest is the request to retrieve a Skill.
message GetSkillRequest {
  string skill_name = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListSkillsRequest is the request to list Skills.
message ListSkillsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// ListSkillsResponse is the response for listing Skills.
message ListSkillsResponse {
  repeated Skill skills = 1;
  string next_page_token = 2;
}

// DeleteSkillRequest is the request to delete a Skill.
message DeleteSkillRequest {
  string skill_name = 1 [(google.api.field_behavior) = REQUIRED];
}
