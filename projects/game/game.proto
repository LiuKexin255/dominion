syntax = "proto3";

package projects.game;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "dominion/projects/game";

// SessionService manages Session resources — the top-level container for a
// game session.
//
// Prefix Path: /api/v1/sessions
service SessionService {
  // CreateSession creates a new Session. AIP-133: https://google.aip.dev/133
  rpc CreateSession(CreateSessionRequest) returns (Session) {
    option (google.api.http) = {
      post: "/api/v1/sessions"
      body: "session"
    };
    option (google.api.method_signature) = "session,session_id";
  }

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sessions"
    };
  }

  rpc GetSession(GetSessionRequest) returns (Session) {
    option (google.api.http) = {
      get: "/api/v1/{name=sessions/*}"
    };
    option (google.api.method_signature) = "name";
  }

  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/{name=sessions/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

// ProxyService manages Agent resources within a Session and provides a
// bidirectional stream for real-time agent communication.
//
// Prefix Path: /api/v1/sessions/{session}/agent
service ProxyService {
  rpc GetAgent(GetAgentRequest) returns (Agent) {
    option (google.api.http) = {
      get: "/api/v1/{name=sessions/*/agent}"
    };
    option (google.api.method_signature) = "name";
  }

  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {
      get: "/api/v1/{parent=sessions/*}/messages"
    };
    option (google.api.method_signature) = "parent";
  }

  // ConnectAgent establishes a bidirectional streaming channel for agent
  // communication. Each frame carries exactly one payload: a PartBlock of
  // content or a single control signal.
  rpc ConnectAgent(stream AgentFrame) returns (stream AgentFrame);

  rpc RefreshAgent(RefreshAgentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/{name=sessions/*/agent}:refresh"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// AgentService provides agent-side operations and a bidirectional stream for
// agent-to-agent communication.
//
// Prefix Path: /api/v1/agents
service AgentService {
  rpc GetAgent(GetAgentRequest) returns (Agent);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc Connect(stream AgentFrame) returns (stream AgentFrame);
  rpc RefreshAgent(RefreshAgentRequest) returns (google.protobuf.Empty);
}

// PromptService manages AgentProfile and Skill resources for agent
// configuration. Resources live under the `prompts/` singleton namespace
// (AIP-156 https://google.aip.dev/156 — collection-less container used purely
// as a path prefix; no Prompt resource message exists).
//
// Prefix Path: /api/v1/prompts
service PromptService {
  // CreateAgentProfile creates a new AgentProfile under prompts.
  // AIP-133: https://google.aip.dev/133
  rpc CreateAgentProfile(CreateAgentProfileRequest) returns (AgentProfile) {
    option (google.api.http) = {
      post: "/api/v1/{parent=prompts}/agentProfiles"
      body: "agent_profile"
    };
    option (google.api.method_signature) = "parent,agent_profile,agent_profile_id";
  }

  rpc GetAgentProfile(GetAgentProfileRequest) returns (AgentProfile) {
    option (google.api.http) = {
      get: "/api/v1/{name=prompts/agentProfiles/*}"
    };
    option (google.api.method_signature) = "name";
  }

  rpc ListAgentProfiles(ListAgentProfilesRequest) returns (ListAgentProfilesResponse) {
    option (google.api.http) = {
      get: "/api/v1/{parent=prompts}/agentProfiles"
    };
  }

  rpc DeleteAgentProfile(DeleteAgentProfileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/{name=prompts/agentProfiles/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // UpdateAgentProfile updates an AgentProfile. AIP-134: https://google.aip.dev/134
  rpc UpdateAgentProfile(UpdateAgentProfileRequest) returns (AgentProfile) {
    option (google.api.http) = {
      patch: "/api/v1/{agent_profile.name=prompts/agentProfiles/*}"
      body: "agent_profile"
    };
    option (google.api.method_signature) = "agent_profile,update_mask";
  }

  // CreateSkill creates a new Skill under prompts. AIP-133: https://google.aip.dev/133
  rpc CreateSkill(CreateSkillRequest) returns (Skill) {
    option (google.api.http) = {
      post: "/api/v1/{parent=prompts}/skills"
      body: "skill"
    };
    option (google.api.method_signature) = "parent,skill,skill_id";
  }

  rpc GetSkill(GetSkillRequest) returns (Skill) {
    option (google.api.http) = {
      get: "/api/v1/{name=prompts/skills/*}"
    };
    option (google.api.method_signature) = "name";
  }

  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (google.api.http) = {
      get: "/api/v1/{parent=prompts}/skills"
    };
  }

  rpc DeleteSkill(DeleteSkillRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/{name=prompts/skills/*}"
    };
    option (google.api.method_signature) = "name";
  }
}

// ─── Shared Resources ──────────────────────────────────────────────────────

// Session is the top-level container for a game session.
message Session {
  option (google.api.resource) = {
    type: "game.liukexin.com/Session"
    pattern: "sessions/{session}"
    plural: "sessions"
    singular: "session"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string session_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Agent represents an agent within a game session.
message Agent {
  option (google.api.resource) = {
    type: "game.liukexin.com/Agent"
    pattern: "sessions/{session}/agent"
    plural: "agents"
    singular: "agent"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string session_id = 2 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string agent_profile_name = 4;
}

// FrameSender identifies the originator of an AgentFrame.
enum FrameSender {
  FRAME_SENDER_UNSPECIFIED = 0;
  FRAME_SENDER_USER = 1;
  FRAME_SENDER_AGENT = 2;
  FRAME_SENDER_SYSTEM = 3;
}

// ImageEncoding specifies the encoding format for image data.
enum ImageEncoding {
  IMAGE_ENCODING_UNSPECIFIED = 0;
  IMAGE_ENCODING_PNG = 1;
}

// MouseClickAction lists the click types accepted by MouseClickPart. MOVE is
// absent on purpose: moving the cursor is expressed by MouseMovePart, so a
// click part cannot structurally carry a move action.
// (Replaces the former bundled mouse-action enum, which combined MOVE + clicks.)
enum MouseClickAction {
  MOUSE_CLICK_ACTION_UNSPECIFIED = 0;
  MOUSE_CLICK_ACTION_LEFT_CLICK = 1;
  MOUSE_CLICK_ACTION_LEFT_DOUBLE_CLICK = 2;
  MOUSE_CLICK_ACTION_RIGHT_CLICK = 3;
  MOUSE_CLICK_ACTION_RIGHT_DOUBLE_CLICK = 4;
  MOUSE_CLICK_ACTION_LEFT_RIGHT_PRESS = 5;
}

// ToolResultStatus indicates the outcome of an executed tool operation.
// (Renamed from AgentOperationResultStatus for coherence with ToolResultPart.)
enum ToolResultStatus {
  TOOL_RESULT_STATUS_UNSPECIFIED = 0;
  TOOL_RESULT_STATUS_SUCCEEDED = 1;
  TOOL_RESULT_STATUS_FAILED = 2;
}

// MouseInputMethod selects the desktop's mouse-execution path for a mouse
// Part (AIP-126 enumeration; values prefixed with the enum name to avoid
// package-level collisions). SIMULATED moves the OS cursor (SetCursorPos)
// and injects button events via SendInput with screen-absolute coordinates.
// WINDOW_MESSAGE posts WM_* button messages to the bound window's HWND
// without moving the cursor, using window-client coordinates packed into
// lParam. UNSPECIFIED is treated as SIMULATED so existing mouse Parts keep
// their prior behavior (spec 018-saolei-mcp FR-004c; AIP-180 — a new
// client-populated field defaults to the pre-existing behavior).
enum MouseInputMethod {
  MOUSE_INPUT_METHOD_UNSPECIFIED = 0;
  MOUSE_INPUT_METHOD_SIMULATED = 1;
  MOUSE_INPUT_METHOD_WINDOW_MESSAGE = 2;
}

// KeyboardKey lists the keys accepted by KeyboardPressPart (AIP-126
// enumeration; values prefixed with the enum name). The set starts with F2 —
// the minesweeper new-game shortcut — and is extensible as future tools
// require additional keys.
enum KeyboardKey {
  KEYBOARD_KEY_UNSPECIFIED = 0;
  KEYBOARD_KEY_F2 = 1;
}

// ─── Content Part Model ────────────────────────────────────────────────────
//
// The content model is split into two disjoint categories
// (specs/023-saolei-mcp-refine/contracts/content-model-contract.md §1..§6;
// spec 023 C3 / FR-001..FR-004):
//
//   - MessagePart (display only) — rendered in the conversation and carried by
//     Message (history) and AgentFrame.message_parts (live): text, thinking,
//     image, tool_call (the model's semantic tool invocation), tool_result.
//   - FlowPart (control only — NEVER rendered in the conversation) — drives
//     desktop execution (mouse/keyboard operations) and turn control
//     (wait/warn/status). A FlowPart is consumed, not displayed
//     (spec 023 FR-005).
//
// This split is structural rather than a render-time filter, so a FlowPart can
// never accidentally render as a chat entry. Live frames and persisted history
// share the identical MessageParts shape, so live view and history render
// identically.

// ToolCallPart carries the model's tool invocation as display content. It is
// the semantic counterpart of the physical FlowPart operation a tool dispatches:
// the conversation shows the tool name + arguments (this part), while the
// desktop executes the operation (a FlowPart). tool_id links the call to its
// subsequent tool_result MessagePart and to the FlowPart operation it dispatches
// (spec 023 FR-002/FR-008). args_json is the model's arguments verbatim
// (JSON.stringify(tool_call.args)); display-only.
message ToolCallPart {
  string tool_id   = 1;
  string name      = 2;
  string args_json = 3;
}

// MessagePart is one display-only content block. The conversation renders only
// MessageParts; they are the sole content of Message (history) and the
// message_parts payload of AgentFrame (live). A tool call and its result are
// both MessageParts (tool_call, tool_result) linked by tool_id.
message MessagePart {
  oneof kind {
    TextPart       text        = 1;
    ThinkingPart   thinking    = 2;
    ImagePart      image       = 3;
    ToolCallPart   tool_call   = 4;  // NEW (spec 023 FR-002)
    ToolResultPart tool_result = 5;
  }
}

// FlowPart is one control-only block. It drives desktop execution (mouse/
// keyboard operations), carries the operation-execution result back to the
// agent (flow_result), and conveys turn control (wait/warn/status); it is NEVER
// rendered as a conversation entry (spec 023 FR-005; spec 025 FR-023/FR-024).
// The operation kinds reuse the existing operation Part messages verbatim
// (MouseMovePart, MouseClickPart, KeyboardPressPart, MouseMoveAndClickPart —
// fields unchanged from spec 018). The signal kinds (wait/warn/status) reuse
// the existing signal messages. flow_result is the control-channel counterpart
// to the operation request kinds, reported by the desktop over this same
// control channel (spec 025 FR-023; data-model.md §1).
message FlowPart {
  oneof kind {
    MouseMovePart         mouse_move           = 1;
    MouseClickPart        mouse_click          = 2;
    KeyboardPressPart     keyboard_press       = 3;
    MouseMoveAndClickPart mouse_move_and_click = 4;
    WaitSignal            wait                 = 5;
    WarnSignal            warn                 = 6;
    StatusSignal          status               = 7;
    // NEW (spec 025 FR-023): the desktop's outcome of an executed FlowPart
    // operation, reported on the control channel.
    FlowResultPart        flow_result          = 8;
  }
}

// MessageParts is the display payload: an ordered list of MessagePart. Carried
// by AgentFrame.message_parts (live) and Message.content (history) — identical
// shape, so live and history render identically (spec 023 FR-009).
message MessageParts {
  repeated MessagePart parts = 1;
}

// FlowParts is the control payload: an ordered list of FlowPart. Carried by
// AgentFrame.flow_parts. Never appears in Message.content.
message FlowParts {
  repeated FlowPart parts = 1;
}

// TextPart carries visible text content.
message TextPart {
  string content = 1;
}

// ThinkingPart carries reasoning / intermediate process content.
message ThinkingPart {
  string content = 1;
}

// ImagePart carries an image (e.g. a captured screenshot).
message ImagePart {
  ImageEncoding encoding = 1;
  bytes data = 2;
  int32 width_px = 3;
  int32 height_px = 4;
  double scale_factor = 5;
  string window_title = 6;
}

// MouseMovePart requests the desktop move the cursor to image-relative
// coordinates. tool_id links the request to its ToolResultPart.
message MouseMovePart {
  string tool_id = 1;
  int32 x_px = 2;
  int32 y_px = 3;
  MouseInputMethod method = 4;
}

// MouseClickPart requests the desktop perform a click at the current cursor
// position. tool_id links the request to its ToolResultPart.
message MouseClickPart {
  string tool_id = 1;
  MouseClickAction click = 2;
  MouseInputMethod method = 3;
}

// KeyboardPressPart requests the desktop press a single key on the bound
// window. tool_id links the request to its ToolResultPart and is stamped by
// OperationBridge.dispatch. The desktop posts the key to the bound HWND
// (e.g. WM_KEYDOWN/WM_KEYUP); the concrete Win32 mechanism is the desktop's
// responsibility (spec 018-saolei-mcp FR-004a). Tool-agnostic: the Part
// carries a key identifier only, never higher-level tool semantics.
message KeyboardPressPart {
  string tool_id = 1;
  KeyboardKey key = 2;
}

// MouseMoveAndClickPart requests the desktop atomically move to and click a
// target in one operation. x_px/y_px are window-client coordinates when
// method = WINDOW_MESSAGE (packed into lParam, no cursor movement); they are
// screenshot-relative screen-target coordinates when method = SIMULATED.
// click reuses MouseClickAction. method selects the desktop execution path.
// (spec 018-saolei-mcp FR-004b/FR-004c; research.md D5.)
message MouseMoveAndClickPart {
  string tool_id = 1;
  int32 x_px = 2;
  int32 y_px = 3;
  MouseClickAction click = 4;
  MouseInputMethod method = 5;
}

// ToolResultPart carries the outcome of an executed tool operation, reported
// by the desktop. tool_id matches the originating MouseMovePart /
// MouseClickPart. Generic across tools: move and click results are
// shape-identical (status + message + screenshot).
message ToolResultPart {
  string tool_id = 1;
  ToolResultStatus status = 2;
  string message = 3;
  ImagePart screenshot = 4;
}

// FlowResultPart carries the desktop's outcome of an executed FlowPart
// operation (mouse/keyboard), reported back over the CONTROL channel
// (FlowParts). It is the operation-channel counterpart to the operation
// request kinds and corresponds shape-wise to ToolResultPart — but it is a
// FlowPart kind, NEVER rendered in the conversation (spec 025 FR-023/FR-024).
// The agent consumes it (OperationBridge.handleResult) and translates it into
// the display tool_result MessagePart per tool (text board for saolei;
// text + screenshot for mouse tools). See
// specs/025-desktop-image-state-refine/contracts/flow-result-contract.md.
message FlowResultPart {
  // Operation-channel id (bridge-minted by OperationBridge.dispatch), matching
  // the originating operation FlowPart's tool_id. Used only for dispatch↔result
  // correlation; unrelated to the conversation tool_call.id (023 C13).
  string tool_id = 1;
  // Operation outcome. Reuses ToolResultStatus (UNSPECIFIED/SUCCEEDED/FAILED).
  ToolResultStatus status = 2;
  // Human/agent-readable outcome detail (e.g. "ok" or an error message).
  string message = 3;
  // Post-action screenshot (control-channel carrier). Consumed by the agent
  // for recognition (saolei) or copied into a mouse tool's display tool_result.
  ImagePart screenshot = 4;
}

// ─── Control Signals ──────────────────────────────────────────────────────
//
// WaitSignal / WarnSignal / StatusSignal carry turn-control signals. Per the
// content-model split (spec 023 C3 / FR-003) they are FlowPart kinds — carried
// by AgentFrame.flow_parts and never rendered as conversation entries. Their
// message shapes are unchanged from spec 018.

// WaitSignal indicates the agent finished a turn and is waiting for input.
message WaitSignal {
  string reason = 1;
}

// WarnSignal carries a warning / recoverable error for the current turn.
message WarnSignal {
  string message = 1;
  string code = 2;
}

// StatusSignalStatus is the lifecycle / connectivity status of an agent turn.
enum StatusSignalStatus {
  STATUS_SIGNAL_STATUS_UNSPECIFIED = 0;
  // ACTIVE: heartbeat sent every 5s while the agent is working (model
  // invocation, tool execution) but has not yet started streaming output.
  STATUS_SIGNAL_STATUS_ACTIVE = 1;
  // IDLE: the agent is bound to a profile and ready for input.
  STATUS_SIGNAL_STATUS_IDLE = 2;
}

// StatusSignal carries a connectivity / lifecycle status. The agent emits
// ACTIVE heartbeats during a turn (before LLM output starts); the desktop
// watches for them and considers the agent lost if none arrive within 10s.
message StatusSignal {
  StatusSignalStatus status = 1;
}

// ─── Frame & Message Envelopes ─────────────────────────────────────────────

// AgentFrame is the transport unit exchanged over WebSocket and gRPC streams.
// A frame carries exactly one payload: a batch of display blocks
// (MessageParts) OR a batch of control blocks (FlowParts). The prior
// content/wait/warn/status cases are removed (clean break, spec 023 C2):
// wait/warn/status became FlowPart kinds (spec 023 FR-003).
message AgentFrame {
  string session_id = 1 [(google.api.field_behavior) = REQUIRED];
  string frame_id = 2;
  google.protobuf.Timestamp create_time = 3;

  // Removed dead metadata (no consumer ever read these):
  reserved 4, 5;
  reserved "invoke_id", "sequence";

  FrameSender sender = 6;
  string agent_profile_name = 7;

  // Exactly one payload per frame: a batch of display blocks OR a batch of
  // control blocks (specs/023-saolei-mcp-refine/contracts/content-model-contract.md §4).
  oneof payload {
    MessageParts message_parts = 11;
    FlowParts    flow_parts    = 12;
  }
  // Prior payload cases (clean break, spec 023 C2): 10 was PartBlock content;
  // 20/21/22 were wait/warn/status (now FlowPart kinds). Reserved for hygiene.
  reserved 10, 20, 21, 22;
  reserved "content", "wait", "warn", "status";
}

// Message is one normalized conversation entry reconstructed from checkpoint
// state (history). Its content is a MessageParts (display blocks only) — the
// identical shape a live AgentFrame's message_parts payload carries, so
// history and live view render identically. Control blocks (FlowParts) never
// appear here (spec 023 FR-004).
message Message {
  option (google.api.resource) = {
    type: "game.liukexin.com/Message"
    pattern: "sessions/{session}/agent/messages/{message}"
    plural: "messages"
    singular: "message"
  };

  string name = 1;
  string message_id = 2;
  FrameSender sender = 3;
  google.protobuf.Timestamp create_time = 4;

  // Content blocks (display only) — identical shape to AgentFrame's
  // message_parts payload (specs/023-saolei-mcp-refine/contracts/content-model-contract.md §5).
  MessageParts content = 5;

  // Removed (clean break, spec 023 C2): the former PartBlock content (field 5
  // type changed from PartBlock to MessageParts) and the legacy flat content
  // fields (type / image_data / operation / operation_result).
  reserved 6, 7, 8, 9;
  reserved "type", "image_data", "operation", "operation_result";
}

// ListMessagesRequest lists Messages under a Session's agent.
// AIP-132: https://google.aip.dev/132
message ListMessagesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/Message"
    }
  ];
  int32 page_size = 2;
  string page_token = 3;
}

// ListMessagesResponse is the response for listing Messages.
message ListMessagesResponse {
  repeated Message messages = 1;
  string next_page_token = 2;
}

// AgentProfile describes the configuration for creating an agent.
message AgentProfile {
  option (google.api.resource) = {
    type: "game.liukexin.com/AgentProfile"
    pattern: "prompts/agentProfiles/{agent_profile}"
    plural: "agentProfiles"
    singular: "agentProfile"
  };

  reserved 2;
  reserved "agent_profile_name";

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string model = 3;
  string system_prompt = 4;
  repeated string skill_names = 5;
  repeated string mcp_names = 6;
  bool enabled = 7;
  repeated string tool_names = 10;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
}

// Skill represents a tool-independent skill definition.
message Skill {
  option (google.api.resource) = {
    type: "game.liukexin.com/Skill"
    pattern: "prompts/skills/{skill}"
    plural: "skills"
    singular: "skill"
  };

  reserved 2;
  reserved "skill_name";

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string content = 3;
  bool enabled = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
}

// ─── Request Messages ──────────────────────────────────────────────────────

// CreateSessionRequest creates a Session. AIP-133: https://google.aip.dev/133
// session_id is empty when the caller defers ID generation to the server.
message CreateSessionRequest {
  Session session = 1 [(google.api.field_behavior) = REQUIRED];
  string session_id = 2;
}

message ListSessionsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2;
}

message GetSessionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Session"
    }
  ];
}

message DeleteSessionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Session"
    }
  ];
}

message GetAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Agent"
    }
  ];
}

message RefreshAgentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Agent"
    }
  ];
}

// CreateAgentProfileRequest creates an AgentProfile under prompts.
// AIP-133: https://google.aip.dev/133
message CreateAgentProfileRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/AgentProfile"
    }
  ];
  string agent_profile_id = 2 [(google.api.field_behavior) = REQUIRED];
  AgentProfile agent_profile = 3 [(google.api.field_behavior) = REQUIRED];

  // Former flat fields (model/system_prompt/skill_names/mcp_names/enabled/
  // tool_names/agent_profile_name) moved onto the AgentProfile message at
  // field 3, per AIP-133's "the resource field carries the request body"
  // template.
  reserved 4, 5, 6, 7;
  reserved "model", "system_prompt", "skill_names", "mcp_names", "enabled", "tool_names", "agent_profile_name";
}

// UpdateAgentProfileRequest updates an AgentProfile. AIP-134: https://google.aip.dev/134
// The resource's name field (AgentProfile.name, pattern
// prompts/agentProfiles/{agent_profile}) is the target identity, surfaced in
// the HTTP path via {agent_profile.name=...}. The standalone `name` field at
// proto field 1 is removed (AIP-134 carries identity on the resource itself).
// Field 2 (now agent_profile) keeps its number for wire compatibility with
// the prior `profile` field.
message UpdateAgentProfileRequest {
  reserved 1;
  reserved "name";

  AgentProfile agent_profile = 2 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 3;
}

message GetAgentProfileRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/AgentProfile"
    }
  ];
}

// ListAgentProfilesRequest lists AgentProfiles under prompts.
// AIP-132: https://google.aip.dev/132
message ListAgentProfilesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/AgentProfile"
    }
  ];
  int32 page_size = 2;
  string page_token = 3;
}

message ListAgentProfilesResponse {
  repeated AgentProfile agent_profiles = 1;
  string next_page_token = 2;
}

message DeleteAgentProfileRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/AgentProfile"
    }
  ];
}

