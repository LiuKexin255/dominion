version: "3.0"
name: game.prod
type: prod
desc: "Game Agent systemt"
services:
  - infra:
      resource: mongodb
      profile: dev-single
      name: mongo
      app: game
      persistence:
        enabled: true
  - artifact:
      path: //projects/game/session/service.yaml
      name: session
  - artifact:
      path: //projects/game/proxy/service.yaml
      name: proxy
  - artifact:
      path: //projects/game/prompt/service.yaml
      name: prompt
  - artifact:
      path: //projects/game/memory/service.yaml
      name: memory
  - artifact:
      path: //projects/game/agent/service.yaml
      name: agent
      secrets:
        provider:
          secret: llm-secrets
          key: opencode-go
  # agent_v2 is stateful (service.yaml kind) and reached only through the
  # proxy's owner affinity — no http block, same as the v1 agent
  # (specs/049-agent-v2-dsh-init/research.md D4).
  - artifact:
      path: //projects/game/agent_v2/service.yaml
      name: agent_v2
      secrets:
        glm-api-token:
          secret: llm-secrets
          key: glm-codingplan
  # Same-hostname path split (specs/049-agent-v2-dsh-init/research.md D5):
  # web serves `/`, the gateway keeps /api/v1/ and adds /api/v2/ — Gateway
  # API merges same-hostname routes by longest PathPrefix.
  - artifact:
      path: //projects/game/web/server/service.yaml
      name: web
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /api/v1/
        - backend: http
          path:
            type: PathPrefix
            value: /api/v2/
