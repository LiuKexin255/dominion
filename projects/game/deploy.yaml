version: "3.0"
name: game.prod
type: prod
desc: "Game Agent systemt"
services:
  - infra:
      resource: mongodb
      profile: dev-single
      name: mongo
      app: game
      persistence:
        enabled: true
  - artifact:
      path: //projects/game/session/service.yaml
      name: session
  - artifact:
      path: //projects/game/proxy/service.yaml
      name: proxy
  - artifact:
      path: //projects/game/prompt/service.yaml
      name: prompt
  - artifact:
      path: //projects/game/memory/service.yaml
      name: memory
  - artifact:
      path: //projects/game/agent/service.yaml
      name: agent
      secrets:
        provider:
          secret: llm-secrets
          key: opencode-go
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /api/v1/
