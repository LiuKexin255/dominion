version: "3.0"
name: game.prod
desc: "game session-gateway-runtime integration deployment"
type: prod
services:
  - infra:
      app: game
      resource: mongodb
      profile: dev-single
      name: mongo
      persistence:
        enabled: true
  - artifact:
      path: //projects/game/session/service.yaml
      name: cmd
  - artifact:
      path: //projects/game/runtime/service.yaml
      name: cmd
      env:
        SESSION_TOKEN_SECRET: "dev-runtime-token-secret"
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: cmd
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /
