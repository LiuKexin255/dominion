version: "3.0"
name: game.{{run}}
desc: "game-session HTTP interface large test"
type: test
services:
  - infra:
      app: game
      resource: mongodb
      profile: dev-single
      name: mongo
  - artifact:
      path: //projects/game/runtime/service.yaml
      name: cmd
      env:
        SESSION_TOKEN_SECRET: "dev-session-token-secret"
        SESSION_TOKEN_TTL: "5m"
        SESSION_IDLE_TTL: "30s"
        GRPC_PORT: "8082"
  - artifact:
      path: //projects/game/session/service.yaml
      name: cmd
      env:
        SESSION_TOKEN_SECRET: "dev-session-token-secret"
  - artifact:
      path: //projects/game/session/testplan/apitest/service.yaml
      name: cmd
    http:
      hostnames:
        - apitest.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /game/session
