name: game-runtime-interface-test
description: |
  Service-level large test for the game runtime WebSocket protocol.
  Covers WS protocol validation, duplicate agent, media cache/catchup,
  control timeout, snapshot refresh, idle cleanup, and token rejection
  scenarios. Tests the runtime directly (not through gateway routing).

suites:
  - name: default
    env: runtime.lt
    deploy: //projects/game/runtime/testplan/test_deploy.yaml
    endpoint:
      http:
        public: https://runtime.game.liukexin.com
    cases:
      - //projects/game/runtime/testplan:testplan_test
