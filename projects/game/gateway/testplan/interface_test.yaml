name: game-gateway-interface-test
description: |
  game-gateway HTTP REST + WebSocket 接口测试 (aggregate exposure, 3 replicas)

  Service: game-gateway
  Interface: grpc-gateway exposed HTTP REST API + WebSocket
  Base path: /v1
  Covered scenarios:
    1. WebConnect_Success — web client connects via WebSocket
    2. AgentConnect_Success — fake-agent connects via WebSocket
    3. PathSessionMismatch_Rejected — path session != token session rejected
    4. DuplicateAgent_Rejected — second agent connection rejected
    5. MediaDelivery — v2 media_init (stream_id, init_id, codec) + media_segment (stream_id, init_id, sequence, random_access) forwarded to web
    6. CatchupFromRandomAccess — new web connection receives cached media from random-access point
    7. V1MediaRejected — old v1 JSON with segment_id/key_frame fields rejected
    8. Snapshot_Cached — fresh cached snapshot returned
    9. Snapshot_Refresh — stale snapshot triggers refresh
    10. Snapshot_ImageNotBlack — snapshot contains real video JPEG data
    11. Snapshot_UnavailableWithoutRandomAccess — no random-access segment → snapshot unavailable
    12. Runtime_Fields — GET /runtime returns state fields
    13. ControlRoundtrip — control_request → ack → result
    14. FlashSnapshot — flash_snapshot refreshes cache
    15. ConcurrentOperations — multiple web ops are serialized
    16. TimeoutSemantics — click/drag timeouts work correctly
    17. AgentDisconnect_Cleanup — agent disconnect clears inflight
    18. AgentConnect_WithAggregateHost — agent connects via aggregate host WebSocket
    19. WebConnect_WithAggregateHost — web connects via aggregate host WebSocket
    20. HTTPRead_WithToken — GET /runtime or /snapshot with valid token → 200
    21. CrossPodRouting — verify request forwarding across gateway replicas
    22. ExpiredToken_Rejected — expired token on WebSocket connect → 401
    23. IdleTTL_SessionCleaned — owner pod ready but session idle > TTL → GetGameRuntime returns NotFound
    24. OwnerPodRestart_OldTokenInvalid — owner pod restart → old token rejected (epoch mismatch)
    25. NoPerInstanceHost — verify deployment no longer depends on per-instance host
    26. CreateSession_ReturnsAggregateHost — create session via session service → verify connect URL uses aggregate host (stub)
    27. WSHoldBeyondTokenTTL — WebSocket stays connected beyond 2x token TTL (stub)
    28. SessionRefresh_NewTokenWorks — refresh session → new token can connect (stub)

suites:
  - name: default
    deploy: //projects/game/gateway/testplan/test_deploy.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/gateway/testplan:testplan_test
