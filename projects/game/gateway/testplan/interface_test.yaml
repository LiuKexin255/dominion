name: game-gateway-system-test
description: |
  System-level test for the game gateway edge proxy architecture.
  Deploys all services (gateway → session → runtime → mongo) and validates
  the full proxy chain: session CRUD via gateway HTTP, WebSocket connect
  via gateway owner proxy, token routing claim extraction, forged token
  rejection, and gateway statelessness.

suites:
  - name: default
    env: ggw.lt
    deploy: //projects/game/gateway/testplan/test_deploy.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/gateway/testplan:testplan_test
