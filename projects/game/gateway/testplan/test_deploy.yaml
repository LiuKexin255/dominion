version: "3.0"
name: game.{{run}}
desc: "game-gateway system-level large test"
type: test
services:
  - infra:
      app: game
      resource: mongodb
      profile: dev-single
      name: mongo
  - artifact:
      path: //projects/game/session/service.yaml
      name: cmd
      env:
        SESSION_TOKEN_SECRET: "dev-session-token-secret"
    grpc:
      hostnames:
        - session.game.liukexin.com
      matches:
        - backend: grpc
          path:
            type: PathPrefix
            value: /
  - artifact:
      path: //projects/game/runtime/service.yaml
      name: cmd
      replicas: 3
      env:
        SESSION_TOKEN_SECRET: "dev-session-token-secret"
        SESSION_TOKEN_TTL: "5m"
        SESSION_IDLE_TTL: "90s"
        GRPC_PORT: "8082"
    http:
      hostnames:
        - runtime.game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /v1
    grpc:
      hostnames:
        - runtime.game.liukexin.com
      matches:
        - backend: grpc
          path:
            type: PathPrefix
            value: /
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: cmd
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /
