version: "3.0"
name: fake-desktop
app: game
kind: stateless
# One manifest + one artifact for the service: behavior variants (won chain /
# progressive / fault injection) are env-driven per deploy file
# (FAKE_DESKTOP_* in projects/game/fake-desktop/cmd/main.go); suites select
# the topology via different deploy files, not per-instance manifests
# (specs/051-agent-v2-dsh-migration/revisions/directive-2026-09-01.md §1).
desc: game fake desktop executor (testplan only — deterministic operation receipts with recognizable screenshots)
ports:
  - name: http
    port: 8080
artifacts:
  - name: fake-desktop
    target: :cmd_image
