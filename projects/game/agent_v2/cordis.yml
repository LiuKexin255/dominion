# dsh composition manifest — the single source of truth for the enabled plugin
# set (specs/051-agent-v2-dsh-migration/contracts/saolei-plugins.md §5;
# specs/059-agent-v2-team-mode/contracts/dsh-plugins.md §5): the dsh core
# plugins composed directly plus the Dominion plugins and the official
# agent-loop / preset registry. Rows are order-insensitive
# (cordis awaits by inject); the ordering below is dependency-layered for reading.
# - timer/invariants/system-prompt enter through the framework-core baseline
#   (@dominion/dsh-core, third_party/dsh/core/package.json); the remaining
#   dsh rows are service-declared npm deps (projects/game/agent_v2/
#   package.json). The preset persona row (@deepseek-ai/dsh-persona) and the
#   saolei-loop capability-dependency rows (@dominion/dsh-saolei,
#   @dominion/dsh-saolei-memory, mounted through the saolei-loop config) all
#   resolve by bare package name from this host composition, so their packages
#   are declared in the same manifest and shipped in the same closure
#   (specs/074-dsh-grpc-runtime/contracts/team-assembly.md §2;
#   specs/058-dsh-preset-roster-demo/contracts/composition-manifest.md §4).
# - GLM endpoint/token injection happens host-side before boot
#   (projects/game/agent_v2/src/dsh.ts, specs/049-agent-v2-dsh-init/research.md D9).
- { id: timer,           name: '@deepseek-ai/cordis-plugin-timer' }
- { id: llm,             name: '@deepseek-ai/dsh-llm' }
- { id: session,         name: '@deepseek-ai/dsh-session' }
# 会话投影注册表（ctx.sessionProjections）：官方 agent-loop 的 static inject
# 与 preset registry 的 inject 都要求该服务在场
# （specs/070-dsh-upgrade/research.md D6；上游源码
# https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/core/agent-loop/src/index.ts）。
- { id: session-projection, name: '@deepseek-ai/dsh-session-projection' }
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false   # 部署自有完整 system prompt（049 D3 延续）
    includeRuntimeContext: false    # 游戏事实只经工具结果落日志（FR-011）
- { id: tools,           name: '@deepseek-ai/dsh-tools' }
- { id: agents,          name: '@deepseek-ai/dsh-agent' }
# 官方 agent loop 回归（specs/059-agent-v2-team-mode/research.md R1/R7）：
# 驱动权回归 ReactLoopAgent，saolei-loop 升为 team loop 编排层；
# Config.agents[] 留空（缺省 = 无 boot-time 声明，agent 全部经
# ctx.agents.create 动态物化）。
- { id: agent-loop,      name: '@deepseek-ai/dsh-agent-loop' }
- { id: invariants,      name: '@deepseek-ai/dsh-invariants' }
# 一致性防护伴生（官方 loop + session/agent/scope 的 request-reconstruction
# 不变量；specs/051-agent-v2-dsh-migration/research.md D5）：三个包的
# ./invariant subpath 导出为普通插件模块
# （name/inject/apply），Loader 按裸说明符动态 import，Node ESM exports map
# 直接解析 subpath 行名。
- { id: invariant-session, name: '@deepseek-ai/dsh-session/invariant' }
- { id: invariant-agent,   name: '@deepseek-ai/dsh-agent/invariant' }
- { id: invariant-scope,   name: '@deepseek-ai/dsh-scope/invariant' }
- { id: llm-retry,       name: '@deepseek-ai/dsh-llm-retry' }
# Preset registry (specs/070-dsh-upgrade/contracts/composition-manifest.md §2;
# specs/070-dsh-upgrade/research.md D2/D5). `default: ''` keeps preset
# selection mandatory: the empty id matches no roster entry, so an id-less
# resolve reports not-found instead of silently falling back to a default
# template (specs/070-dsh-upgrade/research.md D5). The player/planner pool
# templates are NOT declared here: their single source of truth is the
# `templates` snapshot in the `preset-authoring` row config below
# (specs/070-dsh-upgrade/contracts/preset-model-mapping.md §3;
# specs/070-dsh-upgrade/research.md D4 终态结论——2026-09-28 用户裁定移除
# `preset-*` 声明行)。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: ''
# 组合级 gRPC client 基建（ctx.grpc；specs/074-dsh-grpc-runtime/contracts/
# grpc-runtime.md §1）：与框架基线行同级、领域无关、生命周期随组合。RPC
# 依赖型能力经 inject 消费本行，不再各自内嵌连接基建；channel 按 target
# 缓存并跨 service client 共享。
- { id: grpc-runtime, name: '@dominion/dsh-grpc-runtime' }
- id: llm-glm
  name: '@dominion/dsh-llm-glm'
  config:
    apiKeyEnv: GLM_API_KEY                      # bootstrap 三级解析（specs/049-agent-v2-dsh-init/research.md D9）
    baseURL: !!js process.env.GLM_BASE_URL      # bootstrap 解析/默认（同上）
    # 流停滞看护窗口（specs/063-llm-reliability-opencode-go/contracts/llm-failure-taxonomy.md
    # §1 义务 4）。env 注入为字符串而 Config 期望 number，Number() 归一；缺省 300000。
    streamIdleTimeoutMs: !!js Number(process.env.GLM_STREAM_IDLE_TIMEOUT_MS) || 300000
    models:                                     # 模型目录唯一来源（specs/054-agent-v2-bugfixes/contracts/agent-api-changes.md §5；与 session.ts DEFAULT_MODEL / UpdateAgent 校验同源）
      - id: !!js process.env.GLM_MODEL || 'glm-5.3'
        contextWindow: 1000000
      # glm-5.3-flash 以字面量 id 配 1M 窗口：OpenAI 兼容调用形态无需 [1m]
      # 后缀（后缀仅 Anthropic 兼容端点需要，见
      # https://docs.bigmodel.cn/cn/coding-plan/latest-model.md 调用配置）。
      - id: glm-5.3-flash
        contextWindow: 1000000
- id: llm-opencode-go
  name: '@dominion/dsh-llm-opencode-go'
  config:
    apiKeyEnv: OPENCODE_API_KEY                 # 宿主三级解析（specs/063-llm-reliability-opencode-go/research.md D13；空值不携带 Authorization）
    baseURL: !!js process.env.OPENCODE_BASE_URL # bootstrap 解析/默认（同 GLM 行模式）
    # 流停滞看护窗口（specs/063-llm-reliability-opencode-go/contracts/
    # opencode-go-plugin.md §5）。env 注入为字符串而 Config 期望 number，
    # Number() 归一；缺省 300000。
    streamIdleTimeoutMs: !!js Number(process.env.OPENCODE_STREAM_IDLE_TIMEOUT_MS) || 300000
    # FR-015 默认目录 = 官方 Chat Completions 路由全部 16 项
    # （specs/063-llm-reliability-opencode-go/contracts/opencode-go-plugin.md
    # §2 唯一来源）。models 整表覆盖插件默认目录，不得只列首项；首项 id 由
    # OPENCODE_MODEL 覆盖（缺省 glm-5.3），其余 15 项为字面量。
    models:
      - id: !!js process.env.OPENCODE_MODEL || 'glm-5.3'
        contextWindow: 1000000
      - id: glm-5.3-flash
        contextWindow: 1000000
      - id: glm-5.2
        contextWindow: 1000000
      - id: glm-5.1
        contextWindow: 202752
      - id: kimi-k3
        contextWindow: 1048576
      - id: kimi-k2.7-code
        contextWindow: 262144
      - id: kimi-k2.6
        contextWindow: 262144
      - id: longcat-2.0
        contextWindow: 1000000
      - id: deepseek-v4.1-flash
        contextWindow: 1000000
      - id: deepseek-v4-pro
        contextWindow: 1000000
      - id: deepseek-v4-flash
        contextWindow: 1000000
      - id: deepseek-v4-flash-vision-exp
        contextWindow: 1000000
      - id: mimo-v2.5
        contextWindow: 1000000
      - id: mimo-v2.5-pro
        contextWindow: 1048576
      - id: hy4-preview
        contextWindow: 1024000
      - id: hy3
        contextWindow: 256000
- { id: desktop-bridge,  name: '@dominion/dsh-desktop-bridge' }
# preset 创作/编辑面（058 产出复用）：CRUD 只写 store（唯一事实源）+ role
# 池记录；生产存储为 Mongo（game_agent_v2.presets，preset-authoring Store
# seam 的 Mongo 实现）。连接由宿主注入：凭据/URI 解析在 agent_v2 侧
# （presets.ts，T006"Mongo 连接/凭据"模块），经 MONGO_URI 环境变量到达行
# 配置——与 GLM_BASE_URL 注入同型的宿主注入模式，部署凭据逻辑不进通用插件。
- id: preset-authoring
  name: '@dominion/dsh-preset-authoring'
  config:
    storage: mongo
    mongoUri: !!js process.env.MONGO_URI
    mongoDatabase: game_agent_v2
    mongoCollection: presets
    # 模板声明快照（specs/074-dsh-grpc-runtime/contracts/preset-templates.md §1）：
    # 唯一事实源（键 = 模板 id，值 = name/description/plugins）；plugins 为即插即用
    # 自包含插件列表（当前仅 persona 行，无校验、无组装职责），authoring 据此把
    # store 记录派生为 registry 声明，不读模板文件系统。
    templates:
      player:
        name: player
        description: 扫雷 player 池模板：persona 行与即插即用自包含插件列表；saolei 能力经 saolei-loop 依赖列表组装
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是扫雷 player，负责操作桌面扫雷窗口完成对局，并依据 saolei 工具返回的棋盘文本持续推理落子，直到对局结束。你独占桌面控制；一律以工具返回的棋盘事实为准，任何与棋盘不符的说法都先核对再行动；每局结束后是否开启新局由你自行判断。保持冷静、精确，落子前先核对已揭示信息与剩余雷数，不做无依据的猜测。
      planner:
        name: planner
        description: 扫雷 planner 池模板：persona 行与即插即用自包含插件列表；memory 能力经 saolei-loop 依赖列表组装
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是扫雷 planner，负责对局策略与复盘：依据对局记录复盘得失，把值得跨局保留的观察写入长期记忆（调用 memory 工具），并给出下一局可执行的策略。你不操作桌面、不调用扫雷操作工具；策略应具体、可执行，并与长期记忆中的历史观察保持一致；复盘时区分偶然结果与可复用经验，避免把单局噪声当作长期结论。
# team 群聊原语（ctx.team；specs/059-agent-v2-team-mode/contracts/
# dsh-plugins.md §1）。
- { id: team,            name: '@dominion/dsh-team' }
# saolei-loop 是 team loop 编排层（specs/059-agent-v2-team-mode/
# research.md R7）。`config.plugins` 是其能力依赖声明（扁平列表，无角色语义）：
# 列表项挂载为子插件并以 provide 暴露能力面，成员 setup 按角色消费——
# @dominion/dsh-saolei 提供 saoleiTools 静态单元，@dominion/dsh-saolei-memory
# 提供 memoryMount 工厂（携带连接 config，组合级共享 channel）。工具能力不再
# 经预设模板行挂载（specs/074-dsh-grpc-runtime/contracts/team-assembly.md §2；
# preset-templates.md §3）。
- id: saolei-loop
  name: '@dominion/dsh-saolei-loop'
  config:
    plugins:
      - name: '@dominion/dsh-saolei'
      - name: '@dominion/dsh-saolei-memory'
        config:
          target: 'dominion:///game/memory:50051'
          protoPath: 'projects/game/game.proto'
