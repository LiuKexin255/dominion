# sample_compression_planner.yaml — the compress node's PLANNER-channel
# summary response (specs/037-saolei-team-optimize US2 / FR-008/FR-012).
#
# The compress node (projects/game/agent/src/team/compress.ts
# summarizeChannel) invokes the planner model DIRECTLY (model.invoke, not
# createAgent) with PLANNER_SUMMARY_PROMPT + the serialized planner channel +
# "请输出摘要：". The fake-LLM matches the LAST user message text
# (matcher.go Match), so the keyword below is a substring of that prompt's
# instruction line ("请概括关键信息，包括：已复盘局数、策略更新历史、...")
# — it appears in NO other request the large tests send, and in no tool-result
# text.
#
# The serialized planner channel ALSO contains other configs' keywords (the
# review input "本局游戏过程" matches planner-update-strategy). This config's
# name sorts alphabetically BEFORE planner-update-strategy ("compress-..." <
# "planner-..."), so the summary call resolves deterministically to a
# plain-text summary instead of a tool_call response (a tool_call response
# carries empty content → compress.ts rejects it as a blank summary → FR-013
# abort). README.md §4 — the alphabetically-lowest matching name wins.
#
# The response text is pinned as the expected post-compression
# planner-channel content and live summary frame in helpers_test.go
# (expectedPlannerCompressionSummary) and in
# TestNewMessageStore_LoadsEmbeddedSamples — keep all three in sync.
name: compress-planner-summary
keywords:
  - 已复盘局数
# NO `reasoning:` field — see sample_compression_player.yaml: the compress
# node's direct model.invoke requires a plain-string content, and a
# reasoning_content response becomes content BLOCKS (rejected as
# "non-string content", FR-012 abort).
text: "已复盘 5 局，策略更新正常，每局均按新策略执行。"
