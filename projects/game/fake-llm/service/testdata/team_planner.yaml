# team_planner.yaml — the planner-side templates of the saolei team
# (specs/059-agent-v2-team-mode/tasks.md T011; broadcast format contract
# specs/059-agent-v2-team-mode/contracts/dsh-plugins.md §1; drive timing
# specs/059-agent-v2-team-mode/contracts/dsh-plugins.md §2).
#
# The /v1/responses endpoint serves these entries only to the planner member:
# every entry anchors on the planner preset persona's identity opening
# (「你是扫雷 planner」— projects/game/agent_v2/preset-templates/planner/
# planner/agent.cordis.yml, the cross-phase stable contract established by
# T004), so a member whose system prompt does not carry the materialized
# persona can never match them. Declaring system_keywords makes each entry a
# multi-turn template (responses.go isMultiTurnTemplate) and responses-only
# for the chat-completions fallback gate.
#
# Behavior script (quickstart.md V3/V4/V6):
#   - first turn after materialization — the user's first Send triggers it
#     (the orchestration layer synthesizes no drive message, FR-010) and the
#     drive carries no member broadcast yet, so the opening entry declares no
#     history condition and keys on that user message's startup wording. It
#     emits the opening strategy text (which carries the player-side anchor
#     "以下开局计划").
#   - game-end review — the player's terminal turn is the last user batch;
#     the review entries key on the broadcast markers (the player broadcast
#     wrapper, contracts/dsh-plugins.md §1) and require the terminal result
#     in the pre-last-user history, so the review fires whether the last
#     player output is the terminal summary or a later queued-user intake
#     reply. min_turn 2 keeps both off the first turn. The LOSS review writes
#     one fixed cross-game observation through the memory tool first (T023
#     persistence path) and continues with its review text through the tool
#     rule (agent_v2_saolei_tools.yaml).
#   - queued-user intake — the user message is the last user message, which
#     misses the broadcast markers, so the reply entry answers it instead.
#   - snapshot reload — team-planner-memory-snapshot fires only after a
#     refresh whose planner prefetched the written observation (T023).
#
# Lockstep: the expected texts are pinned by the large-test constants in
# projects/game/testplan/ (T018); the embedded-store count/index lockstep
# lives in projects/game/fake-llm/service/message_store_test.go.
messages:
  # team-planner-opening is the first-turn entry: after materialization the
  # orchestration layer rests and synthesizes no drive message (FR-010), so
  # this turn starts from the user's first Send, handled by the initial
  # planner activation. It declares no history/min_turn condition beyond the
  # default min_turn 1 — the drive input at that point carries only that user
  # message (no member broadcast), so any deeper condition would never match.
  # Its keywords span the startup wording range of the user message (the
  # message must be non-empty anyway, since a Responses entry requires at
  # least one keyword — README.md §3): any of 「请」/「开始」/「工作」/
  # 「就绪」/「团队」/「扫雷」/「开局」 in that message selects this entry.
  # The strategy text carries the player-side anchor used by
  # team-player-opening (team_player.yaml).
  #
  # Review/opening priority: declaredResponsesConditions counts four
  # conditions on the review entries against two here (keywords + system),
  # so game-end reviews always outrank this entry (responses.go
  # moreSpecificResponses).
  - name: team-planner-opening
    keywords:
      - 请
      - 开始
      - 工作
      - 就绪
      - 团队
      - 扫雷
      - 开局
    system_keywords:
      - 你是扫雷 planner
    text: "开局计划：优先从棋盘中心区域开始，逐步向边缘推进；遇到数字边界时先标记周边可疑格。@player 请按以下开局计划开始本局游戏。"
    responses_only: true
  # team-planner-review-continue is the game-end review of a won game: it
  # emits the review body plus the next-game strategy whose "@player … 开始下
  # 一局" instruction drives the player's next open (quickstart.md V4:
  # 复盘与续驱第二局).
  #
  # The keywords are the player broadcast wrapper markers (发言
  # <player-message> / 工具 <player-tool-call>, contracts/dsh-plugins.md §1):
  # the last user batch is the player's latest output broadcast, which always
  # carries one of the markers. The terminal result rides the history
  # condition — the raw tool-result text ("game status: won") is relayed
  # verbatim inside the player tool broadcast — so the review fires also when
  # a queued-user intake reply is the last player output (V6).
  - name: team-planner-review-continue
    keywords:
      - "<player-message>"
      - "<player-tool-call>"
    system_keywords:
      - 你是扫雷 planner
    history_keywords:
      - "game status: won"
    min_turn: 2
    text: "本局复盘：全部雷区排除，节奏正确；下一局仍从中心区域推进，数字密集处先推理再操作。@player 请按以下下一局计划开始下一局。"
    responses_only: true
  # team-planner-review-stop is the game-end review of a lost game: it writes
  # the fixed cross-game observation through the memory tool FIRST (T023: the
  # review path is the memory-write path the team memory large test asserts),
  # and the tool-result continuation
  # (testdata/agent_v2_saolei_tools.yaml team-planner-review-stop-text) then
  # emits the review body only (no next-game instruction), so the structurally
  # driven player consumes the broadcast and opens no new game (quickstart.md
  # V4: "不开局" behavior).
  - name: team-planner-review-stop
    keywords:
      - "<player-message>"
      - "<player-tool-call>"
    system_keywords:
      - 你是扫雷 planner
    history_keywords:
      - "game status: lost"
    min_turn: 2
    tool_call:
      name: memory
      arguments:
        action: add
        content: 本局复盘观察：中心区域开局稳定，边角标记需谨慎。
    responses_only: true
  # team-planner-user-reply digests a queued user message (FR-011 消化优先于
  # 切换, V6-2): the queued message is the last user message and misses the
  # broadcast markers, so the review entries step aside. The reply keeps the
  # review-stop wording anchors ("本局到此"/"不再安排新一局") so the
  # subsequently driven player consumes it through team-player-resume-stop
  # and opens no new game — the digest path lands in the same stopped state
  # as the plain loss review.
  #
  # Large-test usage (T018): queued user messages must contain one of
  # 「暂停」/「稍等」/「等待」/「继续」 so this entry matches deterministically
  # (the same anchor set team-player-user-intake matches on the player side).
  - name: team-planner-user-reply
    keywords:
      - 暂停
      - 稍等
      - 等待
      - 继续
    system_keywords:
      - 你是扫雷 planner
    min_turn: 2
    text: "收到你的消息。本局到此为止，不再安排新一局。"
    responses_only: true
  # team-planner-wait is the controllable long-running planner turn (T018
  # queue/cancel/refresh windows): the 4s inter-chunk delay keeps the turn in
  # flight while the suite queues a second message, cancels, or refreshes the
  # team. Its keyword ("planner-wait") is disjoint from every other entry's
  # trigger, so a first message carrying only that keyword selects this entry
  # directly (the opening entry needs the startup wording). It sorts after
  # team-planner-user-reply and before the team-player-* names, so the
  # message_store_test.go index pins shift by one from the player block on.
  #
  # Large-test usage (T018): a message containing "planner-wait" is the
  # in-flight target of the queue-digest, cancel-pause, and refresh cases.
  - name: team-planner-wait
    keywords:
      - planner-wait
    system_keywords:
      - 你是扫雷 planner
    reasoning_chunks:
      - "延迟排查：第一段。"
      - "延迟排查：第二段。"
    chunk_delays: ["4s"]
    text: "延迟排查完成，暂无新计划。"
    responses_only: true
  # team-planner-memory-snapshot fires only when the planner's materialized
  # system prompt already carries the RELOADED long-term memory snapshot: its
  # system_keywords require the snapshot section's header and the fixed
  # observation line the review path writes. The team memory large test uses
  # it after a team refresh — the fresh planner instance prefetches the
  # persisted entry in its setup, so the section is present at its first
  # assembly — to assert the snapshot reached the model context (T023; the
  # previous instance's snapshot was fixed at its own start and cannot match).
  # It shares the opening startup keywords and wins the specificity tie by
  # Name ("team-planner-memory-snapshot" < "team-planner-opening"), shadowing
  # the opening entry only for sessions carrying that exact observation (no
  # other fixture session writes that content).
  - name: team-planner-memory-snapshot
    keywords:
      - 扫雷
    system_keywords:
      - 你是扫雷 planner
      - 长期记忆：
      - 本局复盘观察：中心区域开局稳定
    text: "长期记忆快照已生效：中心区域开局稳定，边角标记需谨慎。"
    responses_only: true
