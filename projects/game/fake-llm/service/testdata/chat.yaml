# chat.yaml — the plain-text chat responses grouped by scenario
# (specs/046-fake-llm-think-chunking/data-model.md §7): greeting,
# chat-only and farewell are the templates the agent matches on ordinary
# conversation turns.
messages:
  # greeting has no "hi" keyword: "hi" ⊂ "t(hi)nk" made greeting hijack
  # every think-* trigger by the alphabetical-name tie-break
  # (specs/044-llm-stall-recovery-fix/tasks.md T021; matching semantics:
  # specs/012-fake-llm-service/spec.md FR-006/FR-007).
  - name: greeting
    keywords:
      - hello
      - greetings
    reasoning: "The user is greeting me, I should respond warmly."
    text: "Hello! How can I help you today?"
  - name: chat-only
    keywords:
      - chat
      - conversation
    reasoning: "Responding with text only, no tools needed."
    text: "Sure, let's chat!"
  - name: farewell
    keywords:
      - bye
      - goodbye
      - see you
    reasoning: "The user is saying goodbye."
    text: "Goodbye! Have a great day!"
