# sample_saolei_start.yaml — drives the FIRST saolei tool_call from a user
# turn. The fake-LLM dispatch fix (Message.tool_call) lets a user-message
# match return a tool_calls response, so the agent_operation / agent_saolei
# large tests can exercise the real model→tool_call→MCP→OperationBridge
# chain. keywords are the trigger phrases the large tests send; tool_call
# points at saolei_init per specs/018-saolei-mcp/contracts/mcp-tool-contract.md.
name: saolei-start
keywords:
  - start saolei
  - play minesweeper
tool_call:
  name: saolei_init
  arguments:
    width: 9
    height: 9
