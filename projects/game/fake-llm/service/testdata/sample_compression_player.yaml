# sample_compression_player.yaml — the compress node's PLAYER-channel summary
# response (specs/037-saolei-team-optimize US2 / FR-008/FR-012).
#
# The compress node (projects/game/agent/src/team/compress.ts
# summarizeChannel) invokes the player model DIRECTLY (model.invoke, not
# createAgent) with PLAYER_SUMMARY_PROMPT + the serialized player channel +
# "请输出摘要：". The fake-LLM matches the LAST user message text
# (matcher.go Match), so the keyword below is a substring of that prompt's
# instruction line ("请概括关键信息，包括：已玩局数、胜负记录、...") — it
# appears in NO other request the large tests send, and in no tool-result
# text.
#
# The serialized player channel ALSO contains other configs' keywords (the
# user text "please start saolei game" matches saolei-start). This config's
# name sorts alphabetically BEFORE saolei-start ("compress-..." <
# "saolei-..."), so the summary call resolves deterministically to a
# plain-text summary instead of a tool_call response (a tool_call response
# carries empty content → compress.ts rejects it as a blank summary → FR-013
# abort). README.md §4 — the alphabetically-lowest matching name wins.
#
# The response text is pinned as the expected post-compression player-channel
# content and live summary frame in helpers_test.go
# (expectedPlayerCompressionSummary) and in
# TestNewMessageStore_LoadsEmbeddedSamples — keep all three in sync.
name: compress-player-summary
keywords:
  - 已玩局数、胜负记录
# NO `reasoning:` field on purpose: the compress node (team/compress.ts
# summarizeChannel) calls model.invoke DIRECTLY and requires a plain-string
# content. A reasoning_content-bearing response is parsed by the LangChain
# OpenAI adapter into content BLOCKS ({type:"reasoning",...} + {type:"text",
# ...}), which compress.ts rejects as "non-string content" (FR-012 abort) —
# see the deployment failure this comment documents. Text-only responses
# yield a plain string.
text: "已玩 5 局，其中 4 局失败。策略：优先翻开角落与边缘格子，命中数字 1 时先标记周围雷。"
