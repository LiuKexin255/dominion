# agent_v2_transient.yaml — the stateful fault-injection templates backing the
# specs/063-llm-reliability-opencode-go SC-001/SC-002/SC-004a/SC-005 large
# tests. The contract is specs/063-llm-reliability-opencode-go/contracts/
# fake-llm-fault-injection.md (§1 transient block, §2 Responses stall, §5
# scenario wiring).
#
# Every entry serves the /v1/responses endpoint and anchors on the planner
# preset persona (「你是扫雷 planner」) so an injection only fires on a
# planner-driven turn. The trigger keywords mirror the testplan-side constant
# style (projects/game/testplan/agent_v2_helpers_test.go, the agentV2Trigger*
# family) and are disjoint from every other fixture's keyword; the
# alphabetical Name tie-break keeps these entries ahead of the
# team-planner-* entries when a message carries a shared startup token
# (agent-v2-* < team-*).
messages:
  # SC-001 single transient request failure: the first matching request is
  # answered with HTTP 503 + Retry-After (the FR-003 server backoff path);
  # the llm-retry re-attempt (request two) sees the exhausted budget and gets
  # the normal planner opening strategy below, so the turn still completes
  # the planning round and hands off to the player.
  - name: agent-v2-transient-503
    keywords:
      - agent-v2-transient-503
    system_keywords:
      - 你是扫雷 planner
    transient:
      times: 1
      http_status: 503
      retry_after: 1
    text: "开局计划：优先从棋盘中心区域开始，逐步向边缘推进；遇到数字边界时先标记周边可疑格。@player 请按以下开局计划开始本局游戏。"
    responses_only: true
  # SC-002 planner failure retention: six matching requests fail with HTTP
  # 500 — the initial attempt plus the default retry budget (normal/5) — so
  # the first Send exhausts the budget exactly. Request seven (the next Send)
  # gets the normal opening strategy and completes the planning turn.
  - name: agent-v2-transient-500
    keywords:
      - agent-v2-transient-500
    system_keywords:
      - 你是扫雷 planner
    transient:
      times: 6
      http_status: 500
    text: "开局计划：优先从棋盘中心区域开始，逐步向边缘推进；遇到数字边界时先标记周边可疑格。@player 请按以下开局计划开始本局游戏。"
    responses_only: true
  # SC-004a stream stall: the Responses projection of the chat wire's
  # stall-mid-reasoning fixture (contract §2). The first reasoning delta is
  # emitted and the stream then blocks with the connection alive (no
  # fake-llm-side timeout) until the caller cancels, so the adapter's idle
  # watchdog converts the stall into a retryable timeout.
  - name: agent-v2-stall
    keywords:
      - agent-v2-stall
    system_keywords:
      - 你是扫雷 planner
    reasoning: "Evaluating the opening strategy before the injected stall."
    text: "This answer never arrives — the injected stall blocks before it."
    stall: true
    responses_only: true
  # SC-005 quota exhaustion: HTTP 429 with the quota wording in the injected
  # body, driving the adapter's QUOTA classification — a visible failure with
  # zero retries. The budget is unbounded because an exhausted quota stays
  # exhausted.
  - name: agent-v2-quota
    keywords:
      - agent-v2-quota
    system_keywords:
      - 你是扫雷 planner
    transient:
      http_status: 429
      error_message: "insufficient quota"
    responses_only: true
  # SC-005 authentication failure: HTTP 401 — the non-retryable AUTH class;
  # the budget is unbounded for the same reason.
  - name: agent-v2-auth
    keywords:
      - agent-v2-auth
    system_keywords:
      - 你是扫雷 planner
    transient:
      http_status: 401
    responses_only: true
