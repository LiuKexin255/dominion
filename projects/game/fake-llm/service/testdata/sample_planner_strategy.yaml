# sample_planner_strategy.yaml — drives the team graph PLANNER agent's
# update_strategy tool_call (specs/031-team-template-mode FR-011/FR-012/D6).
#
# The planner node (projects/game/agent/src/team/planner.ts) is triggered by
# the conditional edge exactly once per game end (won/lost). Its model input
# ends with the review HumanMessage rendered from the buffer's gameLog whose
# text always starts with the FIXED prefix "本局游戏过程：" followed by the
# numbered move lines "1. <tool>(coord) → status" and their board renders,
# then the review instruction (planner.ts buildReviewInput — specs/
# 036-team-mode-bugfix/contracts/team-graph-fix-contract.md §2.2), so
# keyword-matching that prefix makes fake-LLM return an update_strategy
# tool_call deterministically — the planner writes the strategy content to
# the session's StrategyStore (mongo), completing the FR-013/FR-014/FR-015
# strategy flow end-to-end.
#
# The keyword is the planner review prefix verbatim and does not appear in
# any user-turn text the large tests send, so no other suite can match it
# (matcher.go Match keys on the LAST user message of a request). The
# follow-up tool-result response after the update_strategy execution lives
# in sample_update_strategy_tools.yaml.
name: planner-update-strategy
keywords:
  - 本局游戏过程
reasoning: "复盘完成，本局策略需要调整。"
tool_call:
  name: update_strategy
  arguments:
    content: "优先翻开角落与边缘格子，命中数字 1 时先标记周围雷。"
