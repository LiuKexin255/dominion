# saolei.yaml — the agent_saolei user-turn fixtures grouped by scenario
# (specs/046-fake-llm-think-chunking/data-model.md §7): every template
# drives a saolei tool_call from a user turn; the follow-up tool-result
# chain lives in saolei_tools.yaml.
messages:
  # saolei-start drives the FIRST saolei tool_call from a user turn. The
  # fake-LLM dispatch fix (Message.tool_call) lets a user-message match
  # return a tool_calls response, so the agent_operation / agent_saolei
  # large tests can exercise the real model→tool_call→MCP→OperationBridge
  # chain. keywords are the trigger phrases the large tests send; tool_call
  # points at saolei_init per specs/023-saolei-mcp-refine/contracts/tool-dispatch-contract.md
  # §6. Per spec 023 C11 / FR-019, saolei_init takes no arguments (it is a
  # bare F2 new-game dispatch — the prior width/height args affected only the
  # now-removed agent-side grid state).
  #
  # The "继续" keyword additionally matches the calibration instruction
  # contents (planner_tools.yaml planner-memory-multi-hit /
  # planner.yaml compact-instruction — both end with "请继续游戏。"): the
  # REVIEW instruction is APPENDED to the player channel by the planner node
  # (spec 039 FR-017), so it becomes the last user message of the player's
  # next model call — matching "继续" makes the player open the next game
  # (FR-009 — 是否开下一局由 player LLM 决定; the fixture decides to continue)
  # instead of falling into the no-match random fallback. The init instruction
  # (planner.yaml init-instruction) is injected BEFORE the user message
  # (pendingInstruction, FR-015) and never matches here.
  - name: saolei-start
    keywords:
      - start saolei
      - play minesweeper
      - 继续
    tool_call:
      name: saolei_init
      arguments: {}
  # saolei-remain drives a saolei_remain tool_call from a user turn,
  # used by the agent_saolei large-test suite's remain E2E case
  # (specs/029-saolei-coord-remain/contracts/saolei-remain-tool-contract.md
  # §8 / quickstart.md Scenario 5). saolei_remain is the read-only fifth tool
  # (spec 029 US2 / FR-006): it takes no arguments, dispatches nothing, and
  # returns the remain grid.
  #
  # This keyword is sent as a SECOND user turn, after the saolei-start
  # init→click chain (turn 1) has seeded the per-session recognized board
  # state, so saolei_remain reads a recognized board and returns
  # "saolei_remain → computed" rather than the no_active_game rejection
  # (spec FR-011). The shared saolei_start/init fixture always chains
  # saolei_init → saolei_click (saolei_tools.yaml
  # saolei-init-followup-operate), and MatchToolResult breaks ties by
  # alphabetically-first Name (matcher.go), so a saolei_remain follow-up
  # cannot be wired into that shared init chain without breaking the four
  # existing saolei tests. A distinct user-turn keyword keeps saolei_remain
  # isolated: matcher.go Match only fires this Message for user text
  # containing "show remaining mines"/"saolei remain", which no other
  # large-test suite sends, so existing suites are unaffected.
  - name: saolei-remain
    keywords:
      - show remaining mines
      - saolei remain
    tool_call:
      name: saolei_remain
      arguments: {}
  # saolei-single-op drives a SINGLE-FORM saolei_operate tool_call
  # from a user turn (spec 039-planner-memory-calibration US1 — FR-001 dual
  # form: ordinary type/x/y parameters == a length-1 operations batch). Used by
  # TestAgentSaoleiTextBoardFlow's second turn to prove the two forms are
  # equivalent end-to-end: the single-form click dispatches the SAME cell centre
  # as the batch form's first op (saolei_fixtures_test.go saoleiClick1*).
  #
  # This keyword is sent as a SECOND user turn, after the saolei-start
  # init→operate chain (turn 1) has seeded the per-session recognized board
  # state, so the single-form operate runs on a live 16×16 all-INITIAL board.
  - name: saolei-single-op
    keywords:
      - single operate
    tool_call:
      name: saolei_operate
      arguments:
        type: click
        x: 3
        y: 4
  # saolei-structural-stop drives a saolei_operate batch whose
  # SECOND op is structurally rejected (out_of_bounds, FR-002/contract
  # saolei-operate-contract.md §2), so the batch STOPS at op 2 and the remaining
  # ops are not executed. Used by TestAgentSaoleiOperateStructuralStop's second
  # turn, after the saolei-start turn seeded the recognized 16×16 board: op 1
  # (3,4) is legal and dispatches (the test replies), op 2 (99,99) is
  # out-of-bounds → `saolei_operate → stopped at click(99,99) (out_of_bounds)` with
  # exactly ONE dispatch having reached the desktop.
  - name: saolei-structural-stop
    keywords:
      - structural stop
    tool_call:
      name: saolei_operate
      arguments:
        operations:
          - type: click
            x: 3
            y: 4
          - type: click
            x: 99
            y: 99
