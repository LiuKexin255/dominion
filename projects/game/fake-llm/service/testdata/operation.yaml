# operation.yaml — the agent_operation user-turn fixtures grouped by
# scenario (specs/046-fake-llm-think-chunking/data-model.md §7); the
# follow-up tool-result chain lives in operation_tools.yaml.
messages:
  # mouse-trigger drives the FIRST mouse tool_call from a user
  # turn, so the agent_operation large tests exercise the real
  # model→tool_call→OperationBridge dispatch chain (instead of injecting a
  # ToolResultPart directly). keywords are the trigger phrases; tool_call
  # points at mouse_move (post-015 split: x_px/y_px coordinates). The
  # follow-up tool-result chaining lives in operation_tools.yaml
  # (mouse-move-success-text terminates the loop with text).
  - name: mouse-trigger
    keywords:
      - move the mouse
      - position cursor
    tool_call:
      name: mouse_move
      arguments:
        x_px: 100
        y_px: 200
