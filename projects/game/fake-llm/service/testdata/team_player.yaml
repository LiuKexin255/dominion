# team_player.yaml — the player-side message templates of the saolei team
# (specs/059-agent-v2-team-mode/tasks.md T011; broadcast format contract
# specs/059-agent-v2-team-mode/contracts/dsh-plugins.md §1; drive timing
# specs/059-agent-v2-team-mode/contracts/dsh-plugins.md §2).
#
# The /v1/responses endpoint serves these entries only to the player member:
# every entry anchors on the player preset persona's identity opening
# (「你是扫雷 player」— projects/game/agent_v2/preset-templates/player/
# player/agent.cordis.yml, the cross-phase stable contract established by
# T004). Declaring system_keywords makes each entry a multi-turn template
# (responses.go isMultiTurnTemplate) and responses-only for the
# chat-completions fallback gate.
#
# Behavior script (quickstart.md V3/V4/V6):
#   - opening strategy broadcast received → saolei_init (the first game);
#   - review-with-strategy broadcast received (continue behavior) → saolei_init
#     again (the structurally driven next game, FR-009);
#   - review-without-strategy broadcast received (stop behavior) → plain text,
#     no new game;
#   - queued user message digested (FR-011) → plain text acknowledgement.
# The tool-result half of the game chain is NOT duplicated here: it reuses the
# agent_v2_saolei_tools.yaml rules (init → operate batch for the won scenario,
# init → terminal summary for the lost scenario, operate → summary) keyed by
# the agent-v2-saolei-* names, which stay the alphabetically-first candidates
# for those results. The terminal summaries those rules emit are the anchors
# consumed by the planner review entries (team_planner.yaml).
#
# Keyword-space isolation from the existing agent_v2 game fixtures
# (response matching: responses.go matchResponses — most declared conditions
# first, then the lowest name):
#   - the broadcast texts below never contain 「开始一局扫雷」/
#     「progressive minesweeper」/「minesweeper without desktop」/「agent-v2-*」,
#     so the agent_v2 / agent_v2_saolei keyword templates stay unmatched in
#     every team scenario;
#   - every entry is a multi-turn template (priority 1), which outranks the
#     keyword-only templates (priority 2) on queued user turns whose text
#     happens to repeat an existing trigger (e.g. 「继续」 in saolei.yaml).
#
# Lockstep: the expected texts are pinned by the large-test constants in
# projects/game/testplan/ (T018); the embedded-store count/index lockstep
# lives in projects/game/fake-llm/service/message_store_test.go.
messages:
  # team-player-opening consumes the planner opening strategy broadcast
  # (team-planner-opening text carries the anchors below) and opens the first
  # game. min_turn stays at the default 1: the player's first drive carries
  # only the strategy broadcast.
  - name: team-player-opening
    keywords:
      - 以下开局计划
      - 开始本局游戏
    system_keywords:
      - 你是扫雷 player
    tool_call:
      name: saolei_init
      arguments: {}
    responses_only: true
  # team-player-resume-start consumes the planner review-with-strategy
  # broadcast (team-planner-review-continue carries the anchors below) and
  # opens the next game — the typical continuation of FR-009's structural
  # re-drive ("按策略开始下一局"). min_turn 2 keeps the entry off the player's
  # first drive, where only the opening strategy exists.
  - name: team-player-resume-start
    keywords:
      - 下一局计划
      - 开始下一局
    system_keywords:
      - 你是扫雷 player
    min_turn: 2
    tool_call:
      name: saolei_init
      arguments: {}
    responses_only: true
  # team-player-resume-stop consumes the planner review-without-strategy
  # broadcast (team-planner-review-stop / team-planner-user-reply carry the
  # anchors below): the player decides not to open a new game and closes the
  # turn with plain text — the "不开局" behavior of quickstart.md V4.
  - name: team-player-resume-stop
    keywords:
      - 本局到此
      - 不再安排新一局
    system_keywords:
      - 你是扫雷 player
    min_turn: 2
    text: "收到复盘。本局到此为止，暂不开新局，保持待命。"
    responses_only: true
  # team-player-role-lock asserts the player member's system prompt carries
  # BOTH its persona anchor and the saolei tool guidance (the preset-row
  # plugin's `saolei:guidance` section): the second system_keyword is the
  # guidance section's heading, so the entry fires only when the mounted
  # player composition reached the model context (T023 role-lock positive
  # assertion). The reverse absence (no memory traces in the player prompt /
  # no saolei guidance in the planner prompt) awaits the system-prompt read
  # surface (T032/T034); this phase cannot observe absence through the
  # keyword matcher.
  - name: team-player-role-lock
    keywords:
      - player-role-lock
    system_keywords:
      - 你是扫雷 player
      - "## saolei (Minesweeper tools)"
    text: "player 角色锁定：扫雷工具守则已加载。"
    responses_only: true
  # team-player-user-intake digests a queued user message (FR-011: 当前成员
  # 回合结束后先消化排队消息): the user message is the last user message of
  # the drive and misses every broadcast anchor, so the intake entry answers
  # it with plain text. min_turn 2 keeps the entry off the player's first drive.
  #
  # Large-test usage (T018): queued user messages must contain one of
  # 「暂停」/「稍等」/「等待」/「继续」 so this entry matches deterministically.
  - name: team-player-user-intake
    keywords:
      - 暂停
      - 稍等
      - 等待
      - 继续
    system_keywords:
      - 你是扫雷 player
    min_turn: 2
    text: "收到你的消息，我这边情况正常，会继续关注棋盘。"
    responses_only: true
