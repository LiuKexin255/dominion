# sample_init_instruction.yaml — drives the team-INIT scenario's
# instruct_player tool_call (spec 039-planner-memory-calibration US3 —
# FR-015/FR-019; contracts/team-graph-contract.md §2.3/§6).
#
# The one-shot async initInstruction turn (triggered once after
# UpdateTeam(allow_missing=true) materializes the graph — session-team.ts
# runInitTurn, R2) runs the shared instruction node with scenario="init".
# Its model input ends with the request HumanMessage whose text always starts
# with "团队初始化：" (instruction-node.ts buildInstructionRequest), so
# keyword-matching that prefix makes fake-LLM return an instruct_player
# tool_call deterministically. The instruction content lands in
# TeamState.pendingInstruction (no player invoke — FR-015) and is delivered
# with the player's first activation.
#
# The keyword appears in NO user-turn text the large tests send, so no other
# suite can match it. The follow-up response after the tool executes lives in
# sample_planner_tools.yaml (instruct-player-final-text).
name: init-instruction
keywords:
  - 团队初始化
tool_call:
  name: instruct_player
  arguments:
    content: "初始指令：先点中心区域，再按数字展开。"
