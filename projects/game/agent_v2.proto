syntax = "proto3";

package projects.game.v2;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "projects/game/game.proto";

// go_package: the v2 Go generated surface is merged into the game package
// dominion/projects/game — protoc-gen-go-aip v0.1.3 emits the parent
// constructor's receiver type unqualified, which only resolves when the
// parent resources (Template/Session, declared in game.proto) share the
// generated file's Go package
// (specs/051-agent-v2-dsh-migration/revisions/directive-2026-09-01.md §2.6).
// The proto package stays projects.game.v2: wire, REST, and TS are
// unaffected.
option go_package = "dominion/projects/game";

// AgentService is the session-scoped stateful surface of agent_v2: the
// session's team singleton (AIP-156 singletons,
// https://google.aip.dev/156) with its player/planner members, the merged
// team message sequence, the member-view projections, and the Send team
// stream. Team/member/queue/game state lives in the serving instance's
// process memory, so every RPC requires proxy owner affinity — the gateway
// routes this service through the proxy, while the stateless configuration
// surface (PresetService, same host and port) is dialed directly
// (specs/059-agent-v2-team-mode/contracts/team-api.md §1).
// Exposed through the game gateway under /api/v2 (AIP-131 Get,
// https://google.aip.dev/131; AIP-132 standard List,
// https://google.aip.dev/132; AIP-136 custom methods,
// https://google.aip.dev/136; resource names per AIP-122,
// https://google.aip.dev/122).
// Prefix Path: /api/v2
service AgentService {
  // UpdateTeam materializes (or refreshes) the session's team singleton:
  // create-or-update on an AIP-156 singleton (AIP-134 create-or-update,
  // https://google.aip.dev/134#create-or-update) — there is no Create/Delete
  // RPC. The materialization input is the `members` list (one caller-supplied
  // {role, preset, model?} per member; the session face is a scene-agnostic
  // team primitive). Validation is fail-fast and precedes any teardown: the
  // hosting service checks member structure, the scene vocabulary and pool
  // matching, and the model catalog. An already-materialized team is
  // refreshed (in-flight turns terminated, queued messages voided, every
  // member's short-term memory cleared, members rebuilt; create_time
  // preserved).
  rpc UpdateTeam(UpdateTeamRequest) returns (Team) {
    option (google.api.http) = {
      patch: "/api/v2/{team.name=templates/*/sessions/*/team}"
      body: "team"
    };
  }

  // GetTeam returns the session's materialized team (member states,
  // desktop_connected, timestamps); NOT_FOUND while the team is not
  // materialized — the web front end renders its onboarding state from that
  // code. AIP-131: https://google.aip.dev/131
  rpc GetTeam(GetTeamRequest) returns (Team) {
    option (google.api.http) = {
      get: "/api/v2/{name=templates/*/sessions/*/team}"
    };
  }

  // GetTeamMember returns one fixed member (members/player or
  // members/planner) including its output-only system_prompt — the complete
  // assembly result the member instance actually uses. AIP-131:
  // https://google.aip.dev/131
  rpc GetTeamMember(GetTeamMemberRequest) returns (TeamMember) {
    option (google.api.http) = {
      get: "/api/v2/{name=templates/*/sessions/*/team/members/*}"
    };
  }

  // ListTeamMessages lists the team view history: the merged sequence where
  // user input and every member's native output are ordered by the
  // monotonically assigned seq anchor. AIP-132 standard List over the team
  // singleton's message child collection (the parent is the team resource
  // name); AIP-158: https://google.aip.dev/158
  rpc ListTeamMessages(ListTeamMessagesRequest) returns (ListTeamMessagesResponse) {
    option (google.api.http) = {
      get: "/api/v2/{parent=templates/*/sessions/*/team}/messages"
    };
  }

  // ListMemberMessages lists one member's view history: user messages as
  // user, the member's own output as agent, and other members' relayed
  // messages as user messages annotated with their sender (rendered as
  // `user: [sender]…`). AIP-132: https://google.aip.dev/132
  rpc ListMemberMessages(ListMemberMessagesRequest) returns (ListMemberMessagesResponse) {
    option (google.api.http) = {
      get: "/api/v2/{parent=templates/*/sessions/*/team/members/*}/messages"
    };
  }

  // Send one user message and subscribe to the team stream: the server
  // stream runs from acceptance until the team quiesces (no in-flight turn
  // and no pending digestible input), covering every member turn in
  // between, including the orchestrator-driven ones (structural
  // continuation, game-end review, queue digestion, further rounds). The
  // stream carries member event frames (member-labelled turn_start/
  // block_start/delta/block_end/tool_result/turn_end) plus team-level
  // `team_message` frames (the merged-sequence entries, same seq as
  // ListTeamMessages). It is a subscription surface, not the orchestration:
  // a client disconnect MUST NOT stop the team, and cancelling the
  // orchestration happens only through Cancel. Custom method on the session
  // resource (AIP-136: https://google.aip.dev/136); the team must already be
  // materialized — there is no lazy creation
  // (specs/059-agent-v2-team-mode/contracts/team-api.md §3).
  rpc Send(SendRequest) returns (stream ChatEvent) {
    option (google.api.http) = {
      post: "/api/v2/{session=templates/*/sessions/*}:send"
      body: "*"
    };
  }

  // Cancel gracefully terminates the team's in-flight member turn (whichever
  // member is active), pauses the orchestrator's automatic continuation, and
  // preserves queued messages as already-fixed history without triggering a
  // new turn; active team streams end at the resulting static point.
  // Idempotent: a no-op success while already paused. A later Send resumes
  // the loop (the message is handled by the current activation). Custom
  // method on the team singleton resource (AIP-136:
  // https://google.aip.dev/136). Semantics:
  // specs/059-agent-v2-team-mode/contracts/team-api.md §4.
  rpc Cancel(CancelRequest) returns (CancelResponse) {
    option (google.api.http) = {
      post: "/api/v2/{name=templates/*/sessions/*/team}:cancel"
      body: "*"
    };
  }
}

// PresetService is the stateless configuration surface of agent_v2: the
// role-pooled preset collection backing team materialization and the
// deployment-level model catalog. Preset state lives in Mongo and the
// catalog is static plugin configuration, so any agent_v2 instance can serve
// every RPC — the gateway dials agent_v2 directly for this service (no proxy
// owner affinity). Contract:
// specs/059-agent-v2-team-mode/contracts/preset-api.md.
// Prefix Path: /api/v2
service PresetService {
  // CreatePreset creates a Preset under a template; a duplicate caller-id
  // errors with ALREADY_EXISTS. AIP-133: https://google.aip.dev/133
  rpc CreatePreset(CreatePresetRequest) returns (Preset) {
    option (google.api.http) = {
      post: "/api/v2/{parent=templates/*}/presets"
      body: "preset"
    };
  }

  // ListPresets lists Presets under a template. AIP-132:
  // https://google.aip.dev/132
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse) {
    option (google.api.http) = {
      get: "/api/v2/{parent=templates/*}/presets"
    };
  }

  // GetPreset gets a Preset. AIP-131: https://google.aip.dev/131
  rpc GetPreset(GetPresetRequest) returns (Preset) {
    option (google.api.http) = {
      get: "/api/v2/{name=templates/*/presets/*}"
    };
  }

  // UpdatePreset updates a Preset (mutable field: persona).
  // AIP-134: https://google.aip.dev/134
  rpc UpdatePreset(UpdatePresetRequest) returns (Preset) {
    option (google.api.http) = {
      patch: "/api/v2/{preset.name=templates/*/presets/*}"
      body: "preset"
    };
  }

  // DeletePreset deletes a Preset; it does not affect already-materialized
  // team members (their composition is a materialization-time snapshot).
  // AIP-135: https://google.aip.dev/135
  rpc DeletePreset(DeletePresetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v2/{name=templates/*/presets/*}"
    };
  }

  // ListModels returns the read-only deployment-level model catalog
  // (no parent collection, no CRUD). The catalog source is the llm-glm
  // plugin configuration, shared with UpdateTeam's model validation.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse) {
    option (google.api.http) = {
      get: "/api/v2/models"
    };
  }
}

// DesktopBridgeService carries the desktop flow control stream for one
// session: the desktop connects through the gateway's WebSocket endpoint and
// the frames are relayed to the agent_v2 instance owning the session.
// Bidirectional streaming has no REST binding (AIP-127,
// https://google.aip.dev/127) — the WS path is carried by a gateway custom
// route. Frame semantics:
// specs/051-agent-v2-dsh-migration/contracts/desktop-bridge.md §1.
// Prefix Path: /api/v2/templates/{template}/sessions/{session}/connect
service DesktopBridgeService {
  // Connect establishes the bidirectional flow stream. The first UserFrame
  // (gateway-injected identity, StatusSignal probe) binds the connection to
  // the session; a new connection for the same session takes over and closes
  // the previous one. The client sends UserFrames (probes, operation
  // results); the server sends TeamFrames (status responses, operation
  // requests). Frame types are reused verbatim from projects/game/game.proto.
  rpc Connect(stream projects.game.UserFrame) returns (stream projects.game.TeamFrame);
}

// TeamMember is one member of the session's team (the role IS the id;
// members have no independent lifecycle, they are created and released with
// the team). It carries both the caller-supplied materialization
// configuration and the materialized runtime state — input and output are
// the same shape (specs/059-agent-v2-team-mode/data-model.md §2).
message TeamMember {
  option (google.api.resource) = {
    type: "game.liukexin.com/TeamMember"
    pattern: "templates/{template}/sessions/{session}/team/members/{member}"
    singular: "teamMember"
    plural: "teamMembers"
  };

  // The member resource name; the server constructs it from the member role
  // on the output side (the materialization input leaves it unset).
  // Format: templates/{template}/sessions/{session}/team/members/{member}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The member role — a scene vocabulary string (saolei: "player" /
  // "planner"); required in the materialization input and echoed back
  // unchanged on the output side.
  string role = 2;
  // The full preset resource name the member materializes from; required in
  // the materialization input and served as the materialization-time
  // snapshot on the output side.
  string preset = 3 [
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Preset"
    }
  ];
  // The model id; empty in the materialization input means the deployment
  // default, and the output side carries the effective value.
  string model = 4;
  // The member instance's complete effective system prompt assembly
  // (persona + team section + tool guidance + memory snapshot), served only
  // by GetTeamMember.
  string system_prompt = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Team is the session's team singleton resource (AIP-156:
// https://google.aip.dev/156): exactly one per session, materialized via
// UpdateTeam (no Create/Delete RPC). It carries the member configuration
// plus the output-only runtime state.
message Team {
  option (google.api.resource) = {
    type: "game.liukexin.com/Team"
    pattern: "templates/{template}/sessions/{session}/team"
    singular: "team"
    plural: "teams"
  };

  // The team resource name.
  // Format: templates/{template}/sessions/{session}/team
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The member configurations: caller-supplied on the materialization input
  // (one {role, preset, model?} per member) and the materialized member
  // snapshots on the output side — the same shape, so the field is not
  // output-only. The proto imposes no member count or role vocabulary
  // (scene-agnostic primitive); the hosting service validates the scene.
  repeated TeamMember members = 2;
  // The session's desktop bridge connection fact, read from the agent-side
  // connection registry; false when there is no live connection. Output-only.
  bool desktop_connected = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The materialization timestamp; preserved across refreshes (AIP-134
  // output-only create_time). Output-only.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The last materialization/refresh timestamp; refreshed on every
  // UpdateTeam. Output-only.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// UpdateTeamRequest materializes or refreshes the team singleton. The
// resource's name field (Team.name, pattern
// templates/{template}/sessions/{session}/team) is the target identity,
// surfaced in the HTTP path via {team.name=...}. An omitted update_mask
// replaces all mutable fields; the only allowed mask path is `members`
// (whole-list replacement, no per-member patch). allow_missing=true makes
// the call create the team on first use (AIP-134 create-or-update).
message UpdateTeamRequest {
  Team team = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2;
  bool allow_missing = 3;
}

// GetTeamRequest gets the session's team singleton.
message GetTeamRequest {
  // The team resource name to retrieve.
  // Format: templates/{template}/sessions/{session}/team
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Team"
    }
  ];
}

// GetTeamMemberRequest gets one of the team's fixed members.
message GetTeamMemberRequest {
  // The member resource name to retrieve.
  // Format: templates/{template}/sessions/{session}/team/members/{member}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/TeamMember"
    }
  ];
}

// TeamMessage is one entry of the merged team view sequence: the producer
// label (USER or a member), the native message, and the monotonically
// assigned seq anchor (data-model.md §2). The Send team stream carries the
// same shape in its `team_message` frame with the same seq value.
message TeamMessage {
  // The message producer: the reserved value "user" for user input, or a
  // member role (scene vocabulary; saolei: "player" / "planner") for member
  // output. Empty = unset.
  string member = 1;
  // The native message (user input, or the member's own output blocks).
  HistoryMessage message = 2;
  // The merged-sequence anchor: assigned by the single team projection,
  // monotonically increasing, and shared by ListTeamMessages, the
  // team_message stream frame, and the front-end merge.
  int64 seq = 3;
}

// MemberViewMessage is one entry of a member's view history: the message as
// seen by that member plus the sender annotation (USER input, or a relaying
// member — rendered as `user: [sender]…`).
message MemberViewMessage {
  // The message in this member's view (role USER or AGENT).
  HistoryMessage message = 1;
  // The message source: the reserved value "user" for user input, or a
  // member role (scene vocabulary; saolei: "player" / "planner") for a
  // team-broadcast relay. Empty = unset.
  string sender = 2;
}

// ListTeamMessagesRequest lists the team view history.
message ListTeamMessagesRequest {
  // The parent team resource name.
  // Format: templates/{template}/sessions/{session}/team
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Team"
    }
  ];
  int32 page_size = 2;
  string page_token = 3;
}

// ListTeamMessagesResponse is the response for listing team messages.
message ListTeamMessagesResponse {
  repeated TeamMessage messages = 1;
  string next_page_token = 2;
}

// ListMemberMessagesRequest lists one member's view history.
message ListMemberMessagesRequest {
  // The parent member resource name.
  // Format: templates/{template}/sessions/{session}/team/members/{member}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/TeamMember"
    }
  ];
  int32 page_size = 2;
  string page_token = 3;
}

// ListMemberMessagesResponse is the response for listing member messages.
message ListMemberMessagesResponse {
  repeated MemberViewMessage messages = 1;
  string next_page_token = 2;
}

// SendRequest sends one user message to the session's team.
message SendRequest {
  // Full game session resource name: templates/{template}/sessions/{session}.
  // The Session type is declared by projects/game/game.proto (the v1 face
  // of the same game API — shared resource type domain, AIP-123:
  // https://google.aip.dev/123).
  string session = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Session"
    }
  ];
  // The user message text for this turn. Non-empty (INVALID_ARGUMENT).
  string text = 2 [(google.api.field_behavior) = REQUIRED];
}

// CancelRequest cancels the team's in-flight member turn and pauses the
// orchestrator's automatic continuation.
message CancelRequest {
  // The team resource name whose in-flight turn to cancel.
  // Format: templates/{template}/sessions/{session}/team
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Team"
    }
  ];
}

// CancelResponse is the empty response of a successful Cancel; the cancel
// is idempotent (specs/059-agent-v2-team-mode/contracts/team-api.md §4).
message CancelResponse {}

// Preset is the per-template configuration resource a team member
// materializes from. Persistence is the agent_v2 service's own (Mongo,
// survives restarts).
message Preset {
  option (google.api.resource) = {
    type: "game.liukexin.com/Preset"
    pattern: "templates/{template}/presets/{preset}"
    singular: "preset"
    plural: "presets"
  };

  // The preset resource name.
  // Format: templates/{template}/presets/{preset}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The persona prompt (the preset's ONLY user-editable content,
  // preset-api.md §2); empty = fall back to the role default base at
  // materialization time. MUST NOT carry model fields.
  string persona = 2;
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The pool the preset belongs to — a scene vocabulary string (saolei:
  // "player" / "planner"); chosen at create and immutable afterwards
  // (output-only).
  string role = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CreatePresetRequest creates a Preset under a template (AIP-133:
// https://google.aip.dev/133; caller-supplied id). The creation materializes
// a copy of the role's pool template (copy-then-patch: the copy carries the
// pool's plugin rows; the caller's persona is patched into the
// persona row, empty = the template's persona stands).
message CreatePresetRequest {
  // The template to create the preset in.
  // Format: templates/{template}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/Preset"
    }
  ];
  string preset_id = 2 [(google.api.field_behavior) = REQUIRED];
  Preset preset = 3 [(google.api.field_behavior) = REQUIRED];
  // The pool to create the preset into — a scene vocabulary string (saolei:
  // "player" / "planner"); REQUIRED and immutable afterwards
  // (specs/059-agent-v2-team-mode/contracts/preset-api.md §2).
  string role = 4 [(google.api.field_behavior) = REQUIRED];
}

// ListPresetsRequest lists Presets under a template (AIP-132:
// https://google.aip.dev/132; AIP-158: https://google.aip.dev/158).
message ListPresetsRequest {
  // The template to list presets from.
  // Format: templates/{template}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "game.liukexin.com/Preset"
    }
  ];
  int32 page_size = 2;
  string page_token = 3;
  // Optional filter: only presets of this pool are returned; empty = no
  // role filtering (specs/059-agent-v2-team-mode/contracts/preset-api.md
  // §1).
  string role = 4;
}

// ListPresetsResponse is the response for listing Presets.
message ListPresetsResponse {
  repeated Preset presets = 1;
  string next_page_token = 2;
}

// GetPresetRequest gets a Preset (AIP-131: https://google.aip.dev/131).
message GetPresetRequest {
  // The preset resource name to retrieve.
  // Format: templates/{template}/presets/{preset}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Preset"
    }
  ];
}

// UpdatePresetRequest updates a Preset (AIP-134:
// https://google.aip.dev/134). The resource's name field (Preset.name,
// pattern templates/{template}/presets/{preset}) is the target identity,
// surfaced in the HTTP path via {preset.name=...}. update_mask supports the
// persona path only; an omitted mask replaces all mutable fields. The
// role is immutable: it is not a mutable field, so a mask naming it is
// INVALID_ARGUMENT (specs/059-agent-v2-team-mode/contracts/preset-api.md
// §2).
message UpdatePresetRequest {
  Preset preset = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2;
}

// DeletePresetRequest deletes a Preset (AIP-135: https://google.aip.dev/135).
message DeletePresetRequest {
  // The preset resource name to delete.
  // Format: templates/{template}/presets/{preset}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "game.liukexin.com/Preset"
    }
  ];
}

// Model is one entry of the read-only deployment-level model catalog.
message Model {
  string id = 1;
  int32 context_window = 2;
}

// ListModelsRequest lists the deployment-level model catalog (no parent
// collection).
message ListModelsRequest {}

// ListModelsResponse is the response for listing Models.
message ListModelsResponse {
  repeated Model models = 1;
}

// ─── Streaming events ────────────────────────────────────────────────────────

// ChatEvent is one streamed event of a Send team stream. Two frame classes
// share the envelope (specs/059-agent-v2-team-mode/contracts/team-api.md
// §3.2):
//
// - member event frames (turn_start/block_start/delta/block_end/tool_result/
//   turn_end): `member` names the producing member; turn_id is minted per
//   member turn, block index is globally monotonic and step is monotonic
//   within that member turn (front-end groups by (member, turn_id));
// - team-level frames (`queued`, `team_message`): no outer `member`.
//
// The payload vocabulary mirrors dsh StreamChunk one-to-one (plus the
// queued/turn lifecycle envelopes).
message ChatEvent {
  string session = 1 [(google.api.field_behavior) = REQUIRED];
  // Server-minted member-turn identity (UUID); constant across one member
  // turn's events. Empty on team-level frames.
  string turn_id = 2;
  // The producing member of a member event frame — a scene vocabulary role
  // string (saolei: "player" / "planner"); unset on team-level frames.
  string member = 3;
  oneof payload {
    QueuedEvent queued = 10;
    TurnStartEvent turn_start = 11;
    BlockStartEvent block_start = 12;
    BlockDeltaEvent delta = 13;
    BlockEndEvent block_end = 14;
    TurnEndEvent turn_end = 15;
    ToolResultEvent tool_result = 16;
    // One merged-sequence entry appended to the team history, carrying the
    // same seq value as the ListTeamMessages element for that entry.
    TeamMessage team_message = 17;
  }
}

// The message was enqueued behind a running turn; position is the 1-based
// queue slot at enqueue time. Team-level frame (no outer member); emitted
// only on the stream that accepted the message, as its first frame.
message QueuedEvent { int32 position = 1; }

message TurnStartEvent {}

// BlockType selects the delta semantics of a content block.
enum BlockType {
  BLOCK_TYPE_UNSPECIFIED = 0;
  BLOCK_TYPE_TEXT = 1;
  BLOCK_TYPE_THINK = 2;
  BLOCK_TYPE_TOOL_CALL = 3;
}

message BlockStartEvent {
  int32 index = 1;
  BlockType type = 2;
  // TOOL_CALL only: the provider-issued call id and tool name.
  string tool_id = 3;
  string name = 4;
  // Model output step this block belongs to (1-based: the server step
  // loop's sequence number, monotonic within a member turn; 0 is only the
  // missing-field sentinel); blocks sharing a step form one display
  // segment (specs/054-agent-v2-bugfixes/contracts/agent-api-changes.md §1).
  int32 step = 5;
}

// One incremental text fragment of the block at `index`; semantics derive
// from the owning BlockStartEvent.type (TEXT body / THINK reasoning /
// TOOL_CALL raw JSON argument fragment).
message BlockDeltaEvent {
  int32 index = 1;
  string text = 2;
  // Model output step this block belongs to (1-based: the server step
  // loop's sequence number, monotonic within a member turn; 0 is only the
  // missing-field sentinel); blocks sharing a step form one display
  // segment (specs/054-agent-v2-bugfixes/contracts/agent-api-changes.md §1).
  int32 step = 3;
}

message BlockEndEvent {
  int32 index = 1;
  ContentBlock block = 2;
  // Model output step this block belongs to (1-based: the server step
  // loop's sequence number, monotonic within a member turn; 0 is only the
  // missing-field sentinel); blocks sharing a step form one display
  // segment (specs/054-agent-v2-bugfixes/contracts/agent-api-changes.md §1).
  int32 step = 3;
}

// ToolResultEvent carries one tool execution's terminal outcome. tool_id is
// the join key back to the originating tool-call block; the web client
// finalizes the matching block on arrival.
message ToolResultEvent {
  // The provider-issued tool call id this result belongs to.
  string tool_id = 1;
  // Terminal tool status: SUCCEEDED or FAILED.
  ToolStatus status = 2;
  // The rendered result text (board text / error text).
  string result = 3;
}

enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_COMPLETED = 1;
  TURN_STATUS_ERROR = 2;   // model/transport failure; team stays usable
  TURN_STATUS_ABORTED = 3; // turn aborted mid-flight (refresh / shutdown)
  TURN_STATUS_CANCELED = 4; // user terminated the turn via :cancel
}

message TurnError {
  string code = 1;
  string message = 2;
}

message TurnUsage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 reasoning_tokens = 3;
}

message TurnEndEvent {
  TurnStatus status = 1;
  TurnError error = 2;
  TurnUsage usage = 3;
}

// ─── History ─────────────────────────────────────────────────────────────────

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_AGENT = 2;
}

message HistoryMessage {
  // Server-assigned per-session sequence id (e.g. "m1", "m2").
  string message_id = 1;
  Role role = 2;
  google.protobuf.Timestamp create_time = 3;
  repeated ContentBlock blocks = 4;
  // True when this assistant step's content is an interrupted prefix: the
  // LLM stream failed or was cancelled before the step settled, so the
  // step carries no final answer and failed turns stay unfolded
  // (specs/054-agent-v2-bugfixes/data-model.md §2/§1.5, FR-005). Absent
  // for settled steps and user messages.
  bool interrupted = 5;
}

// ContentBlock is one display content block.
message ContentBlock {
  oneof kind {
    TextBlock text = 1;
    ThinkBlock think = 2;
    ToolCallBlock tool_call = 3;
  }
}

message TextBlock { string content = 1; }

message ThinkBlock { string content = 1; }

enum ToolStatus {
  TOOL_STATUS_UNSPECIFIED = 0;
  TOOL_STATUS_RUNNING = 1;
  TOOL_STATUS_SUCCEEDED = 2;
  TOOL_STATUS_FAILED = 3;
}

message ToolCallBlock {
  string tool_id = 1;
  string name = 2;
  // Raw JSON arguments string, as produced by the model.
  string args_json = 3;
  ToolStatus status = 4;
  // Human-readable execution result; linked to the call in one block. The
  // terminal status/result are backfilled by tool_id when the matching
  // tool_result arrives (specs/051-agent-v2-dsh-migration/research.md D10).
  string result = 5;
}
