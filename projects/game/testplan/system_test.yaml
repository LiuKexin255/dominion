name: game-system-test
description: |
  Game system integration test — two suites over two deployment topologies
  (specs/054-agent-v2-bugfixes/contracts/testplan.md §2). Six formerly
  separate suites share one deployment, so the plan pays two deploys
  instead of seven (five deployments and their 60s settle waits saved).

  Suite 1 (game-system): the full system on deploy_agent_v2.yaml — the
    won topology whose fake-desktop executor plays the won board on the
    desktop-e2e-won session. Cases run serially in module order: the
    configuration face (session CRUD, MemoryService storage API, web
    static hosting) → the conversation face (the /api/v2 NDJSON surface
    and the preset configuration closed loop) → the game face (the
    fake-llm game chain over the executor session) → the desktop face
    (the flow-control stream from the desktop's side, test-driven).
  Suite 2 (game-disconnect): the mid-game disconnect and recovery branch
    on deploy_agent_v2_drop.yaml — the same service list with the
    executor running the progressive scenario plus the disconnect fault
    env. Placed after the main suite: guitar runs suites serially and
    stops on the first failure, so the trunk regression surfaces first.

  Cases isolate through unique session/preset resource names, so the
  shared deployment needs no per-case redeployment.

suites:
  - name: game-system
    description: "The full game system on the won topology (deploy_agent_v2.yaml), cases ordered by tested module: session CRUD and ListSessions pagination over /api/v1; the MemoryService storage API (Create/Update/Delete/List, AIP-158 pagination, AIP-193 error codes); web static hosting and the page's management loop; the agent_v2 conversation surface (/api/v2 NDJSON streaming with per-step block segmentation, history backfill, injected-failure ERROR turns with the interrupted tail visible, :cancel semantics, desktop connection status); the preset configuration closed loop (CRUD, materialization, model catalog); the game loop over the desktop-e2e-won executor session (won chain, desktop-absent, multi-session isolation, two-stream independence); and the flow-control stream from the desktop's side"
    deploy: //projects/game/testplan/deploy_agent_v2.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:testplan_test          # session module
      - //projects/game/testplan:memory_test            # memory module
      - //projects/game/testplan:web_test               # web static hosting
      - //projects/game/testplan:agent_v2_conversation_test
      - //projects/game/testplan:agent_v2_preset_test
      - //projects/game/testplan:agent_v2_game_test     # game face on the won topology
      - //projects/game/testplan:desktop_flow_test
  - name: game-disconnect
    description: "The mid-game disconnect and recovery branch (specs/051-agent-v2-dsh-migration/contracts/desktop-bridge.md §6 验收锚点 3) on the drop topology (deploy_agent_v2_drop.yaml): the service list matches deploy_agent_v2.yaml but the single fake-desktop executor runs the progressive scenario with the disconnect-after-3-ops fault env, bound to the desktop-e2e-drop session. agent_v2_game_disconnect_test drives the three-game sequence: game 1 completes with the disconnect firing invisibly behind the last receipt (flow fault, conversation stream unaffected); game 2 meets the torn connection — saolei_init fails with the model-visible 'desktop disconnected' error while the turn survives; game 3, after the executor's reconnect, plays a full game with the board re-seeded by init. The disconnect binary is separate from agent_v2_game_test because guitar runs whole bazel targets as suite cases without per-suite test-function filtering"
    deploy: //projects/game/testplan/deploy_agent_v2_drop.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_v2_game_disconnect_test  # mid-game disconnect three-game sequence
