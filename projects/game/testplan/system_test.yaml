name: game-system-test
description: |
  Game system integration test — 11 suites organized by tested object.
 
  Suite 1 (prompt): prompt service + gateway.
    - Agent profile CRUD
    - Skill CRUD
  Suite 2 (session): session + proxy + agent(test) + prompt + gateway.
    - Session CRUD + ListSessions pagination
  Suite 3 (session-agent lifecycle): session + proxy + agent(test) + prompt + gateway.
    - WebSocket connect without prior agent creation (on-demand adapter)
    - Profile switching mid-connection
    - Connection exclusivity (second connect kicks first)
    - GetAgent for never-connected sessions
    - Disconnect/reconnect history persistence
    - WebSocket status/echo probes, unknown fields, invalid JSON
  Suite 4 (agent dialog): session + proxy + agent(test) + prompt + gateway.
    - Agent dialog with fake LLM: connect chat with profile,
      thinking + text response, FIFO queue behavior,
      deterministic content, profile loose coupling
  Suite 5 (agent queue): session + proxy + agent(test) + prompt + gateway.
    - Queue-while-running (specs/030-queued-chat-input): input during a run,
      auto hand-off, multi-message combine, QueueSignal depth visibility.
  Suite 6 (checkpoint-resume): session + proxy + agent(test) + prompt + gateway.
    - Send messages, leave, re-enter, verify ListMessages
    - Verify agent remains functional after re-enter
    - Cross-profile history persistence
  Suite 7 (per-profile-model): session + proxy + agent(test) + prompt + gateway.
    - Two profiles with different models
    - Verify each profile's model is configured correctly
  Suite 8 (concurrent-serialization): session + proxy + agent(test) + prompt + gateway.
    - Send two messages rapidly, verify FIFO processing order
  Suite 9 (agent-multimodal): session + proxy + agent(test) + prompt + gateway.
    - Text-plus-image turn (message_parts of [TextPart, ImagePart] processed end-to-end)
    - Image-only turn accepted (empty text, random fallback acceptable)
    - Large-image (> 32 KiB) round-trip over the binary-protobuf WS leg
      (spec 025 FR-007/FR-008/FR-010 — would have torn the session under the
      old protojson-text + 32 KiB read-limit regime)
  Suite 10 (agent-operation): session + proxy + agent(test) + prompt + gateway.
    - Mouse-tool dispatch chain: agent receives a FlowResultPart on the control
      channel and emits the correct display tool_result end-to-end (spec 025
      FR-023..FR-026); real SUCCEEDED/FAILED status carried through (spec 023 D4);
      operation FlowPart carries a bridge-minted id decoupled from the
      conversation tool_call.id (spec 023 D10); FlowResultPart.screenshot
      forwarded into the mouse tool's display tool_result.
  Suite 11 (agent-saolei): session + proxy + agent(test) + prompt + gateway.
    - saolei MCP returns a TEXT board (no image block; spec 025 FR-012/FR-022)
      recognized by @dominion/game-saolei-board from the FlowResultPart.screenshot;
      illegal moves (e.g. click on a revealed cell) are rejected BEFORE dispatch
      with a stable reason code (spec 025 FR-014/FR-015); saolei tool_result
      status is neutral (UNSPECIFIED, never FAILED) per spec 023 D12.

suites:
  - name: prompt
    deploy: //projects/game/testplan/deploy_prompt.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:testplan_test

  - name: session
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:session_test

  - name: session-agent
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_lifecycle_test

  - name: agent-dialog
    description: "Agent dialog with fake-llm service: connect, chat, verify thinking + text response with FIFO ordering"
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_dialog_test

  - name: agent-queue
    description: "Agent queue-while-running with fake-llm service (specs/030-queued-chat-input): input during a run does not disturb the in-flight turn (specs/030-queued-chat-input/spec.md FR-001/FR-002), queued message auto-becomes the next turn (specs/030-queued-chat-input/spec.md FR-005/FR-006), multiple queued messages combine into one aggregated turn FIFO (specs/030-queued-chat-input/spec.md FR-004/FR-005), QueueSignal depth changes drive pending visibility (specs/030-queued-chat-input/spec.md FR-008/FR-009)"
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_dialog_test

  - name: checkpoint-resume
    description: "Agent checkpoint-resume with fake-llm service: send messages, leave/re-enter, verify history and cross-profile persistence"
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_checkpoint_test

  - name: per-profile-model
    description: "Per-profile model configuration with fake-llm service: verify each profile resolves the correct model"
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_checkpoint_test

  - name: concurrent-serialization
    description: "Concurrent message serialization with fake-llm service: rapid sends processed in strict FIFO order"
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_checkpoint_test

  - name: agent-multimodal
    description: "Agent multimodal turns with fake-llm service: text+image message_parts payload processed end-to-end; image-only turn accepted; large-image (> 32 KiB) round-trip over the binary-protobuf WS leg (spec 025 FR-007/FR-010)"
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_multimodal_test

  - name: agent-operation
    description: "Agent mouse-tool dispatch chain with fake-llm service: agent receives a FlowResultPart on the control channel (spec 025 FR-023/FR-024) and emits the correct display tool_result end-to-end; real SUCCEEDED/FAILED status carried through (spec 023 D4); operation FlowPart carries a bridge-minted id decoupled from the conversation tool_call.id (spec 023 D10); FlowResultPart.screenshot forwarded into the mouse tool's display tool_result (spec 025 FR-025/FR-026)"
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_operation_test

  - name: agent-saolei
    description: "Agent saolei MCP text-board flow with fake-llm service: saolei tools return a TEXT board recognized by @dominion/game-saolei-board from the FlowResultPart.screenshot (spec 025 FR-012/FR-022, no model-facing image); illegal moves rejected BEFORE dispatch with a stable reason code (spec 025 FR-014/FR-015); saolei tool_result status is neutral (UNSPECIFIED, never FAILED) per spec 023 D12"
    deploy: //projects/game/testplan/deploy_agent.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:agent_saolei_test
