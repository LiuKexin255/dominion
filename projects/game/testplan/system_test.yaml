name: game-agent-step1-system-test
description: |
  Game agent step1 system integration test

  Services: session, proxy, agent, gateway + MongoDB
  Interface: HTTP REST API + WebSocket
  Base path: /api/v1/
  Test cases:
    1. Create session
    2. Create agent
    3. MongoDB records exist
    4. Get agent returns owner
    5. Consistent owner routing
    6. WebSocket connect
    7. WebSocket status response (status + echo frames)
    8. WebSocket unknown fields (DiscardUnknown)
    9. WebSocket invalid JSON (connection close)
    10. Delete agent and session (NotFound verification)
    11. Delete session cascade (cleans up agent/owner)
    12. Delete agent cascade (cleans up owner, session persists)
    13. Full lifecycle (create→status WS→delete→verify NotFound)

suites:
  - name: default
    deploy: //projects/game/testplan/deploy.yaml
    endpoint:
      http:
        public: https://game.liukexin.com
    cases:
      - //projects/game/testplan:testplan_test
