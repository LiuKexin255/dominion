version: "3.0"
name: game.{{run}}
type: test
desc: "Game agent dialog test (agent test artifact)"
services:
  - infra:
      resource: mongodb
      profile: dev-single
      name: mongo
      app: game
      persistence:
        enabled: false
  - artifact:
      path: //projects/game/session/service.yaml
      name: session
  - artifact:
      path: //projects/game/proxy/service.yaml
      name: proxy
  - artifact:
      path: //projects/game/agent/service_test.yaml
      name: agent
  - artifact:
      path: //projects/game/prompt/service.yaml
      name: prompt
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /api/v1/
