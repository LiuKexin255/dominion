version: "3.0"
name: game.{{run}}
type: test
desc: "Game agent stall-recovery test (agent test artifact, idle timeout 60s)"
services:
  - infra:
      resource: mongodb
      profile: dev-single
      name: mongo
      app: game
      persistence:
        enabled: false
  - artifact:
      path: //projects/game/session/service.yaml
      name: session
  - artifact:
      path: //projects/game/proxy/service.yaml
      name: proxy
  - artifact:
      path: //projects/game/fake-llm/service.yaml
      name: fake-llm
  - artifact:
      path: //projects/game/agent/service.yaml
      name: agent_test
      env:
        GAME_STREAM_IDLE_TIMEOUT_MS: "60000"
  - artifact:
      path: //projects/game/memory/service.yaml
      name: memory
  - artifact:
      path: //projects/game/prompt/service.yaml
      name: prompt
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /api/v1/
