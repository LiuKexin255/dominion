version: "3.0"
name: game.{{run}}
type: test
desc: "Game agent_v2 memory-down test deployment (specs/059-agent-v2-team-mode/tasks.md T023 / quickstart V7-2): the same service list as deploy_agent_v2.yaml WITHOUT the memory service, so the planner member's materialization-time memory prefetch cannot resolve its dominion endpoint and UpdateTeam must fail loud with no half-materialized team. fake-llm stays because the agent_v2 boot resolves GLM_LLM_TARGET at startup"
services:
  - infra:
      resource: mongodb
      profile: dev-single
      name: mongo
      app: game
      persistence:
        enabled: false
  - artifact:
      path: //projects/game/session/service.yaml
      name: session
  # The memory service is DELIBERATELY absent (T023 V7-2): the planner's
  # `ctx.plannerMemory.load` prefetch rejects, which must roll the whole
  # team materialization back.
  - artifact:
      path: //projects/game/fake-llm/service.yaml
      name: fake-llm
  # fake-llm must stay deployed: the agent_v2 bootstrap resolves
  # GLM_LLM_TARGET through the dominion resolver at startup
  # (projects/game/agent_v2/src/dsh.ts resolveBaseURL), so a missing LLM
  # endpoint would fail the boot before any request reaches UpdateTeam.
  # The desktop executor is unused by this suite; it is kept so the topology
  # matches deploy_agent_v2.yaml apart from the memory omission.
  - artifact:
      path: //projects/game/fake-desktop/service.yaml
      name: fake-desktop
      env:
        FAKE_DESKTOP_GATEWAY_URL: dominion:///game/gateway:80
        FAKE_DESKTOP_SESSION: desktop-e2e-won
        FAKE_DESKTOP_SCENARIO: won
  - artifact:
      path: //projects/game/proxy/service.yaml
      name: proxy
  - artifact:
      path: //projects/game/agent_v2/service.yaml
      name: agent-v2-test
      env:
        GLM_LLM_TARGET: dominion:///game/fake-llm:8080
  - artifact:
      path: //projects/game/web/server/service.yaml
      name: web
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /api/v1/
        - backend: http
          path:
            type: PathPrefix
            value: /api/v2/
