version: "3.0"
name: game.{{run}}
type: test
desc: "Game agent_v2 sts2 minimal-wiring test deployment (specs/080-host-main-sub-model/contracts/testplan-game-sts2.md §1): the six-service slim topology for the game-sts2 suite — mongo + session + fake-llm + proxy + agent-v2-test + gateway. web (the saolei-fixed frontend), fake-desktop (sts2 has no desktop flow) and memory (the sts2 scene mounts no memory) are deliberately absent; the no-memory boot is the same shape deploy_agent_v2_memory_down.yaml proves."
services:
  - infra:
      resource: mongodb
      profile: dev-single
      name: mongo
      app: game
      persistence:
        enabled: false
  - artifact:
      path: //projects/game/session/service.yaml
      name: session
  # fake-llm serves the sts2 ping fixture on /v1/responses and must stay
  # deployed: the agent_v2 bootstrap resolves GLM_LLM_TARGET through the
  # dominion resolver at startup (projects/game/agent_v2/src/dsh.ts
  # resolveBaseURL).
  - artifact:
      path: //projects/game/fake-llm/service.yaml
      name: fake-llm
  - artifact:
      path: //projects/game/proxy/service.yaml
      name: proxy
  - artifact:
      # The zero-secret test artifact (the same one deploy_agent_v2.yaml
      # deploys): the LLM endpoints route to fake-llm, and the opencode-go row
      # carries the synthetic credential that ITS OWN suite verifies; sts2
      # only needs the GLM row, so both stay declared for deployment parity.
      path: //projects/game/agent_v2/service.yaml
      name: agent-v2-test
      env:
        GLM_LLM_TARGET: dominion:///game/fake-llm:8080
        OPENCODE_LLM_TARGET: dominion:///game/fake-llm:8080
        OPENCODE_API_KEY: test-opencode-token
  # The gateway keeps both REST prefixes; no web service competes for `/`
  # (the session face: gateway → proxy owner affinity → agent_v2; the preset
  # configuration face: gateway → agent_v2 direct).
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /api/v1/
        - backend: http
          path:
            type: PathPrefix
            value: /api/v2/
