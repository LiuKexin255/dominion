version: "3.0"
name: game.{{run}}
type: test
desc: "Game agent_v2 disconnect test deployment (same service list as deploy_agent_v2.yaml; the single fake-desktop runs the progressive scenario with the disconnect-after-3-ops fault injection — specs/051-agent-v2-dsh-migration/revisions/directive-2026-09-01.md §1.3)"
services:
  - infra:
      resource: mongodb
      profile: dev-single
      name: mongo
      app: game
      persistence:
        enabled: false
  - artifact:
      path: //projects/game/session/service.yaml
      name: session
  - artifact:
      path: //projects/game/memory/service.yaml
      name: memory
  - artifact:
      path: //projects/game/fake-llm/service.yaml
      name: fake-llm
  # Single deterministic desktop executor (specs/051-agent-v2-dsh-migration/
  # research.md D15) bound to the drop session: it plays the progressive
  # scenario and injects one mid-game disconnect per connection lifetime —
  # after the third operation receipt (init F2 + two cell ops) the
  # connection closes, so the NEXT game's init dispatch fails with "desktop
  # disconnected" while a game already in flight finished unaffected
  # (US1 scenarios 5/6). The won topology lives in deploy_agent_v2.yaml.
  - artifact:
      path: //projects/game/fake-desktop/service.yaml
      name: fake-desktop
      env:
        FAKE_DESKTOP_GATEWAY_URL: dominion:///game/gateway:80
        FAKE_DESKTOP_SESSION: desktop-e2e-drop
        FAKE_DESKTOP_SCENARIO: progressive
        FAKE_DESKTOP_FAULT_DISCONNECT_AFTER_OPS: "3"
  # Session face two-hop / configuration face direct — see the proxy entry
  # in deploy_agent_v2.yaml.
  - artifact:
      path: //projects/game/proxy/service.yaml
      name: proxy
  - artifact:
      # The zero-secret test artifact (service.yaml declares agent-v2-test
      # with no secrets — specs/049-agent-v2-dsh-init/research.md D9); see
      # the agent-v2-test entry in deploy_agent_v2.yaml for the full note.
      path: //projects/game/agent_v2/service.yaml
      name: agent-v2-test
      env:
        GLM_LLM_TARGET: dominion:///game/fake-llm:8080
        # preset roster roots (specs/059-agent-v2-team-mode/research.md R3):
        # the template system roots scan the shipped preset-templates data,
        # and the writable user root is a fixed path on the container's
        # temporary writable layer (Pod 重建即丢 — store 为 source of truth,
        # 副本可从 store 记录重建; roster-verification §5 对照 1 precedent).
        PRESET_TEMPLATES_ROOT: /dominion/game/agent-v2/preset-templates
        PRESET_WRITABLE_ROOT: /var/lib/game-agent-v2/presets
  - artifact:
      path: //projects/game/web/server/service.yaml
      name: web
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /api/v1/
        - backend: http
          path:
            type: PathPrefix
            value: /api/v2/
