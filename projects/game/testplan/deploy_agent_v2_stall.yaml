version: "3.0"
name: game.{{run}}
type: test
desc: "Game agent_v2 stall-guard test deployment (specs/063-llm-reliability-opencode-go/tasks.md T019 / quickstart SC-004a): the same service list as deploy_agent_v2.yaml, but the agent-v2-test instance pins GLM_STREAM_IDLE_TIMEOUT_MS=2000 so a Responses wire stall is detected inside a 2s idle window. The main topology cannot be reused for this: its fixtures carry legitimate 3s/4s chunk gaps that the production 300s window tolerates and a 2s window would misjudge"
services:
  - infra:
      resource: mongodb
      profile: dev-single
      name: mongo
      app: game
      persistence:
        enabled: false
  - artifact:
      path: //projects/game/session/service.yaml
      name: session
  - artifact:
      path: //projects/game/memory/service.yaml
      name: memory
  - artifact:
      path: //projects/game/fake-llm/service.yaml
      name: fake-llm
  # Single deterministic desktop executor (specs/051-agent-v2-dsh-migration/
  # research.md D15) bound to the won session; kept so the topology matches
  # deploy_agent_v2.yaml apart from the watchdog env (mirrors
  # deploy_agent_v2_memory_down.yaml's reuse pattern).
  - artifact:
      path: //projects/game/fake-desktop/service.yaml
      name: fake-desktop
      env:
        FAKE_DESKTOP_GATEWAY_URL: dominion:///game/gateway:80
        FAKE_DESKTOP_SESSION: desktop-e2e-won
        FAKE_DESKTOP_SCENARIO: won
  # /api/v2 routing splits by where an RPC's state lives
  # (specs/051-agent-v2-dsh-migration/revisions/directive-2026-09-01.md §3):
  # the session face (AgentService / DesktopBridgeService) is a mandatory
  # proxy hop — gateway → proxy (owner affinity, game_proxy.agent_v2_owners)
  # → agent_v2 stateful instance (specs/049-agent-v2-dsh-init/contracts/
  # conversation-api.md §1 托管拓扑); the stateless configuration face
  # (PresetService: preset state in Mongo, static model catalog) is dialed
  # by the gateway directly, with no proxy owner affinity.
  - artifact:
      path: //projects/game/proxy/service.yaml
      name: proxy
  - artifact:
      # The zero-secret test artifact (service.yaml declares agent-v2-test
      # with no secrets — specs/049-agent-v2-dsh-init/research.md D9); all
      # LLM credentials below are synthetic (not real secrets).
      path: //projects/game/agent_v2/service.yaml
      name: agent-v2-test
      env:
        # The fake model endpoint via Dominion service discovery; the
        # bootstrap resolves it to http://{endpoint}/v1.
        GLM_LLM_TARGET: dominion:///game/fake-llm:8080
        # SC-004a: the independent 2s idle watchdog window. The main topology
        # fixtures have 3s/4s normal chunk gaps, so this window may only be
        # deployed on the dedicated stall topology (specs/063-llm-reliability-
        # opencode-go/research.md D13/D15).
        GLM_STREAM_IDLE_TIMEOUT_MS: "2000"
        # The opencode-go row routes to the same fake endpoint (synthetic
        # credential, not a real secret — conditional Authorization +
        # zero-leakage coverage; fake-llm ignores credentials).
        OPENCODE_LLM_TARGET: dominion:///game/fake-llm:8080
        OPENCODE_API_KEY: test-opencode-token
  # Same-hostname path split: web serves `/`, the gateway keeps /api/v1/ and
  # /api/v2/ (Gateway API merges same-hostname routes by longest PathPrefix —
  # specs/049-agent-v2-dsh-init/research.md D5).
  - artifact:
      path: //projects/game/web/server/service.yaml
      name: web
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /
  - artifact:
      path: //projects/game/gateway/service.yaml
      name: gateway
    http:
      hostnames:
        - game.liukexin.com
      matches:
        - backend: http
          path:
            type: PathPrefix
            value: /api/v1/
        - backend: http
          path:
            type: PathPrefix
            value: /api/v2/
