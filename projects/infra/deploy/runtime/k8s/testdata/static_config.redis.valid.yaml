namespace: default
managed_by: dominion.io
gateway:
  name: traefik-gateway
  namespace: ingress
redis:
  dev-single:
    image: redis
    version: "8.4"
    port: 6379
    storage:
      storage_class_name: local-path
      capacity: 1Gi
      access_modes:
        - ReadWriteOncePod
      volume_mode: Filesystem
